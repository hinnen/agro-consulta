(()=>{'use strict';

9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',edit:'<path d="m4 20 5-.8L20 8a2 2 0 0 0-4-4L5 15l-1 5Z"/>',check:'<path d="m4 12 5 5L20 6"/>',share:'<path d="M12 16V3m-5 5 5-5 5 5M4 14v6h16v-6"/>',chart:'<path d="M3 3v18h18M7 16v-5M12 16V7m5 9v-8"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',bolt:'<path d="m13 2-9 11h7l-1 9 10-12h-7l1-8Z"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5h-5a2.5 2.5 0 0 0 0 5h3a2.5 2.5 0 0 1 0 5h-5M12 6v12"/>',file:'<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-7-7Zm0 0v7h7"/>',alert:'<path d="m12 3 10 18H2L12 3Zm0 7v4m0 3h.01"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',back:'<path d="m15 18-6-6 6-6"/>'};
const icon=(name)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]||ICON.info}</svg>`;
const CATEGORIES=['Rações','Sacaria','Ferragens e Ferramentas','Medicamentos e Venenos','Alimentação Rural','Agricultura e Jardim','Outros'];
const CAT_WEIGHTS=[.38,.275,.105,.07,.07,.045,.055];

  {id:1,name:'Milho em grãos — 40 kg',cat:'Sacaria',unit:52,icon:'bag'},
  {id:2,name:'Farelo de trigo — 30 kg',cat:'Sacaria',unit:36,icon:'bag'},
  {id:3,name:'Ração Akiles Adultos — 15 kg',cat:'Rações',unit:83,icon:'bag'},

  {id:5,name:'Ração Special Dog — 15 kg',cat:'Rações',unit:108,icon:'bag'},
  {id:6,name:'Ração Origens Gatos — 1 kg',cat:'Rações',unit:18.4,icon:'bag'},
  {id:7,name:'Ração Robustus — 15 kg',cat:'Rações',unit:75,icon:'bag'},
  {id:8,name:'Parafuso e ferragens (mix)',cat:'Ferragens e Ferramentas',unit:15,icon:'box'},
  {id:9,name:'Ferramentas manuais (mix)',cat:'Ferragens e Ferramentas',unit:42,icon:'box'},
  {id:10,name:'Vermífugos veterinários (mix)',cat:'Medicamentos e Venenos',unit:28,icon:'box'},
  {id:11,name:'Antiparasitários (mix)',cat:'Medicamentos e Venenos',unit:41,icon:'box'},
  {id:12,name:'Ração postura — 25 kg',cat:'Alimentação Rural',unit:67,icon:'bag'},
  {id:13,name:'Sementes e jardinagem (mix)',cat:'Agricultura e Jardim',unit:26,icon:'layers'},
  {id:14,name:'Acessórios variados (mix)',cat:'Outros',unit:24,icon:'box'}];
const STORES=[{id:'centro',name:'Centro',short:'Centro',base:2480},{id:'vila',name:'Vila Elias',short:'Vila Elias',base:1430}];
const PAYMENTS=[{id:'pix',name:'Pix',color:'#0fa77e'},{id:'credito',name:'Crédito',color:'#ee651c'},{id:'debito',name:'Débito',color:'#7b7cdd'},{id:'dinheiro',name:'Dinheiro',color:'#48a5d2'},{id:'fiado',name:'Fiado',color:'#e4b754'}];
const seed=n=>{let x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x)};
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);
const shortMoney=n=>{if(Math.abs(n)>=1000)return 'R$ '+new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(n/1000)+' mil';return money(n)};
const integer=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}).format(n||0);
const pct=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1,minimumFractionDigits:1}).format(Number(n)||0)+'%';
const dayKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const parseDay=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dateLabel=(s,opts={day:'2-digit',month:'short'})=>parseDay(s).toLocaleDateString('pt-BR',opts).replace('.','');
const cloneDate=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const today=cloneDate(new Date()),todayKey=dayKey(today);
const addDays=(d,amount)=>{const x=cloneDate(d);x.setDate(x.getDate()+amount);return x};
const round=n=>Math.round(n*100)/100;
const sum=(list,key)=>round(list.reduce((t,x)=>t+(typeof key==='function'?key(x):Number(x[key]||0)),0));
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const persisted=(()=>{try{return JSON.parse(localStorage.getItem('gm_mobile_demo_v3'))||{}}catch{return {}}})();
const state={view:'overview',store:persisted.store||'all',period:persisted.period||'30',metric:'revenue',rank:'revenue',pay:'all',category:'all',search:'',sort:'revenue',selectedBucket:-1,customStart:persisted.customStart||'',customEnd:persisted.customEnd||'',goals:persisted.goals||{centro:76000,vila:44000},hidden:false,dark:!!persisted.dark};
const save=()=>{try{localStorage.setItem('gm_mobile_demo_v3',JSON.stringify({store:state.store,period:state.period,customStart:state.customStart,customEnd:state.customEnd,goals:state.goals,dark:state.dark}))}catch{}};
const mock=[];
for(let t=405;t>=0;t--){const d=addDays(today,-t),iso=dayKey(d),dn=Math.floor(d.getTime()/86400000),week=d.getDay();for(const s of STORES){if(s.id==='vila'&&iso<'2026-08-08')continue;let mult=week===0?.20:week===6?.76:1;let modulation=.84+seed(dn+(s.id==='centro'?9:79))*.32;let season=1+Math.sin(dn/19)*.08;let partial=t===0?.42:1;let rev=round(Math.max(0,s.base*mult*modulation*season*partial));let orders=rev?Math.max(1,Math.round(rev/(60+seed(dn+17)*26))):0;let costs=round(rev*(.69+seed(dn+9)*.055));let expense=round(rev*(.19+seed(dn+29)*.045));let cat={},prod={},payments={};let totalFactor=0;const cw=CAT_WEIGHTS.map((w,i)=>{let v=w*(.89+seed(dn+i*22+(s.id==='centro'?0:62))*.22);totalFactor+=v;return v});let carry=0;CATEGORIES.forEach((c,i)=>{let v=i===CATEGORIES.length-1?round(rev-carry):round(rev*cw[i]/totalFactor);cat[c]=v;carry=round(carry+v);const items=PRODUCTS.filter(p=>p.cat===c);let pc=0;items.forEach((p,j)=>{const weight=items.length===1?1:((j+2)/(items.length*(items.length+3)/2));let val=j===items.length-1?round(v-pc):round(v*weight);prod[p.id]=val;pc=round(pc+val)})});let pays=[.34,.24,.17,.16,.09];let pCarry=0;PAYMENTS.forEach((p,i)=>{const x=i===PAYMENTS.length-1?round(rev-pCarry):round(rev*pays[i]);payments[p.id]=x;pCarry=round(pCarry+x)});mock.push({date:iso,store:s.id,revenue:rev,orders,cmv:costs,expenses:expense,categories:cat,products:prod,payments})}}
const receipts=[];let receiptNo=32500;
for(const d of mock.filter(x=>x.date>=dayKey(addDays(today,-42)))){const count=Math.min(d.orders,40);if(!count)continue;const weights=Array.from({length:count},(_,i)=>.55+seed(i*19+parseInt(d.date.replaceAll('-',''),10)+(d.store==='centro'?1:5))*.95);const ws=sum(weights,x=>x);let carry=0;for(let i=0;i<count;i++){let value=i===count-1?round(d.revenue-carry):round(d.revenue*weights[i]/ws);carry=round(carry+value);const prod=PRODUCTS[Math.floor(seed(i*22+parseInt(d.date.slice(-2))+d.date.length)*PRODUCTS.length)];const pay=PAYMENTS[Math.floor(seed(i*13+Number(d.date.slice(-2)))*PAYMENTS.length)];receipts.push({id:++receiptNo,date:d.date,store:d.store,value,payment:pay.id,product:prod.name,minute:Math.floor(seed(i*29+receiptNo)*60),hour:8+Math.floor(seed(i*5+receiptNo)*10)})}}
receipts.sort((a,b)=>b.date.localeCompare(a.date)||b.hour-a.hour||b.minute-a.minute);
const padStore=id=>id==='all'?'As duas lojas':id==='centro'?'Loja Centro':'Vila Elias';
function range(){if(state.period==='custom'&&state.customStart&&state.customEnd)return{start:state.customStart,end:state.customEnd};let days=Number(state.period)||30;return{start:dayKey(addDays(today,-days+1)),end:todayKey}}
function rowsInRange(r=range(),store=state.store){return mock.filter(x=>x.date>=r.start&&x.date<=r.end&&(store==='all'||x.store===store))}
function aggregate(rows){let revenue=sum(rows,'revenue'),orders=sum(rows,'orders'),cmv=sum(rows,'cmv'),expenses=sum(rows,'expenses');let categories={},products={},payments={};for(const d of rows){for(const [k,v] of Object.entries(d.categories))categories[k]=round((categories[k]||0)+v);for(const [k,v] of Object.entries(d.products))products[k]=round((products[k]||0)+v);for(const [k,v] of Object.entries(d.payments))payments[k]=round((payments[k]||0)+v)}return{revenue,orders,cmv,expenses,profit:round(revenue-cmv-expenses),gross:round(revenue-cmv),margin:revenue?((revenue-cmv)/revenue*100):0,netMargin:revenue?(revenue-cmv-expenses)/revenue*100:0,ticket:orders?revenue/orders:0,categories,products,payments}}
function previousRange(r=range()){const first=parseDay(r.start),last=parseDay(r.end),days=Math.round((last-first)/86400000)+1;return{start:dayKey(addDays(first,-days)),end:dayKey(addDays(first,-1))}}
function comparison(){const now=aggregate(rowsInRange()),previous=aggregate(rowsInRange(previousRange()));return{now,previous,delta:previous.revenue?(now.revenue-previous.revenue)/previous.revenue*100:null}}
function monthRange(){let first=new Date(today.getFullYear(),today.getMonth(),1);return{start:dayKey(first),end:todayKey}}
function monthDays(){return new Date(today.getFullYear(),today.getMonth()+1,0).getDate()}
function goalValue(){return state.store==='all'?Number(state.goals.centro)+Number(state.goals.vila):Number(state.goals[state.store])||0}
function monthProgress(){const v=aggregate(rowsInRange(monthRange())).revenue,goal=goalValue(),p=goal>0?100*v/goal:0,projection=today.getDate()>0?v/today.getDate()*monthDays():0;return{value:v,goal,percent:p,projection,remaining:Math.max(goal-v,0)}}
function periodText(){let r=range();return `${dateLabel(r.start,{day:'2-digit',month:'short',year:'numeric'})} — ${dateLabel(r.end,{day:'2-digit',month:'short',year:'numeric'})}`}
function hide(v,format=money){return state.hidden?'R$ •••••':format(v)}
function title(text,subtitle='',button=''){return `<div class="section-title"><div><h2>${text}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${button}</div>`}
function miniIcon(name,variant=''){return `<span class="stat-icon ${variant}">${icon(name)}</span>`}
const navItems=[['overview','dashboard','Resumo'],['sales','trend','Vendas'],['products','bag','Produtos'],['finance','wallet','Financeiro'],['goals','target','Metas']];
function buildTop(){const now= new Date();let name=now.getHours()<12?'Bom dia':now.getHours()<18?'Boa tarde':'Boa noite';return `<header class="topbar"><div class="brand"><div class="brand-mark">GM</div><div><div class="brand-word"><span>Sist</span><b>App</b></div><span class="brand-sub">GM AGRO MAIS · GESTÃO</span></div></div><div class="head-actions"><button class="icon-btn" data-action="toggle-hide" aria-label="${state.hidden?'Mostrar':'Ocultar'} valores" title="Ocultar/mostrar valores">${icon(state.hidden?'eyeoff':'eye')}</button><button class="icon-btn" data-action="refresh" aria-label="Atualizar indicadores" title="Atualizar">${icon('refresh')}</button><button class="icon-btn" data-action="options" aria-label="Mais opções" title="Opções">${icon('menu')}</button></div></header><section class="intro"><div><div class="eyebrow">${name} · ${today.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div><h1>${({overview:'Painel gerencial',sales:'Análise de vendas',products:'Produtos e categorias',finance:'Visão financeira',goals:'Metas da operação'})[state.view]}</h1><p>${({overview:'Sua operação, em um só lugar.',sales:'Explore faturamento, pagamentos e movimentações.',products:'Descubra quais itens movimentam suas lojas.',finance:'Acompanhe receitas, custos e resultados.',goals:'Veja o progresso e simule novos objetivos.'})[state.view]}</p></div><span class="intro-badge">Modo gerencial</span></section><div class="controls"><div class="stores" role="group" aria-label="Filtrar por loja">${[['all','Consolidado'],['centro','Centro'],['vila','Vila Elias']].map(([id,label])=>`<button type="button" class="${state.store===id?'active':''}" data-action="store" data-id="${id}" aria-pressed="${state.store===id}">${label}</button>`).join('')}</div><div class="filters"><button class="filter-button" data-action="period-sheet">${icon('calendar')} ${state.period==='custom'?'Personalizado':state.period+' dias'} ${icon('down')}</button></div></div><div class="demo-notice">${icon('info')} <span><b>Protótipo interativo.</b> Valores simulados para testar a interface. Ainda não há conexão com o banco de dados.</span></div>`}
function bottomNav(){return `<nav class="bottom-nav" aria-label="Navegação do dashboard"><div class="nav-wrap">${navItems.map(([v,ic,label])=>`<button type="button" class="nav-item ${state.view===v?'active':''}" data-action="nav" data-id="${v}" aria-current="${state.view===v?'page':'false'}">${icon(ic)}<span>${label}</span></button>`).join('')}</div></nav>`}
function statCard(key,iconName,variant,label,value,trend){return `<button class="stat" data-action="stat" data-id="${key}">${miniIcon(iconName,variant)}<span class="stat-arrow">${icon('chevron')}</span><span class="stat-label">${label}</span><strong class="stat-number">${value}</strong><span class="stat-trend ${trend&&trend[0]==='-'?'negative':''}">${trend||'Toque para analisar'}</span></button>`}
function buckets(){let r=range(),list=[];let start=parseDay(r.start),end=parseDay(r.end),days=Math.max(1,Math.round((end-start)/86400000)+1);let grouping=days<=9?'day':days<=35?'step':days<=100?'week':'month';if(grouping==='month'){let cursor=new Date(start.getFullYear(),start.getMonth(),1);while(cursor<=end){let s=cursor<start?start:cursor;let next=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);let e=addDays(next,-1);if(e>end)e=end;list.push({start:dayKey(s),end:dayKey(e),label:cursor.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')});cursor=next}}else {let step=grouping==='day'?1:grouping==='step'?3:7;let cursor=start;while(cursor<=end){let next=addDays(cursor,step-1);if(next>end)next=end;list.push({start:dayKey(cursor),end:dayKey(next),label:grouping==='day'?dateLabel(dayKey(cursor),{day:'2-digit'}):dateLabel(dayKey(cursor),{day:'2-digit',month:'short'})});cursor=addDays(next,1)}}return list.map(b=>({...b,totals:aggregate(rowsInRange({start:b.start,end:b.end}))}))}
function barChart(){const bs=buckets(),metric=state.metric,values=bs.map(b=>b.totals[metric]||0),max=Math.max(1,...values);let active=state.selectedBucket>=0&&state.selectedBucket<bs.length?state.selectedBucket:bs.length-1;const current=bs[active]||{totals:{revenue:0,orders:0},start:todayKey,end:todayKey};return `<div class="chart-head"><div><strong>${metric==='orders'?integer(sum(bs,x=>x.totals.orders)):hide(sum(bs,x=>x.totals.revenue))}</strong><small style="display:block;margin-top:3px">${metric==='orders'?'vendas no período':'faturamento no período'}</small></div><div class="segmented"><button data-action="metric" data-id="revenue" class="${metric==='revenue'?'active':''}">R$</button><button data-action="metric" data-id="orders" class="${metric==='orders'?'active':''}">Vendas</button></div></div><div class="bars-chart"><div class="chart-grid"><i></i><i></i><i></i><i></i></div><div class="bar-list" role="group" aria-label="Gráfico interativo de vendas">${bs.map((b,i)=>`<button class="bar-hit ${active===i?'active':''}" data-action="bucket" data-id="${i}" aria-label="${esc(b.start===b.end?dateLabel(b.start):dateLabel(b.start)+' a '+dateLabel(b.end))}: ${metric==='orders'?integer(b.totals.orders)+' vendas':money(b.totals.revenue)}" aria-pressed="${active===i}"><div class="bar-track"><div class="bar-fill" style="height:${Math.max(2,values[i]/max*100).toFixed(2)}%"></div></div><small>${esc(b.label)}</small></button>`).join('')}</div></div><div class="chart-selection"><div><strong>${current.start===current.end?dateLabel(current.start,{day:'2-digit',month:'long'}):dateLabel(current.start)+' até '+dateLabel(current.end)}</strong><small>${metric==='orders'?integer(current.totals.orders)+' vendas':hide(current.totals.revenue)} · ${padStore(state.store)}</small></div><button data-action="bucket-detail" data-id="${active}">Detalhar ${icon('chevron')}</button></div>`}
function storeCompare(){const bs=STORES.map(s=>({id:s.id,name:s.name,a:aggregate(rowsInRange(range(),s.id))})),total=sum(bs,x=>x.a.revenue);return `<div class="card">${title('Comparativo das lojas','Toque em uma loja para aplicar o filtro')}<div class="comparison">${bs.map((s,i)=>`<div><button class="store-row" data-action="store" data-id="${s.id}"><h3><span class="store-dot ${i?'orange':''}"></span>${s.name}</h3><strong>${hide(s.a.revenue)}</strong></button><div class="progress-wrap"><div class="progress ${i?'orange':''}"><div style="width:${total?Math.max(0,s.a.revenue/total*100):0}%"></div></div><div class="progress-caption"><span>${pct(total?s.a.revenue/total*100:0)} do total</span><span>${integer(s.a.orders)} vendas</span></div></div></div>`).join('')}</div></div>`}
function categoriesCard(){let a=aggregate(rowsInRange()),entries=Object.entries(a.categories).sort((x,y)=>y[1]-x[1]).slice(0,5),max=entries[0]?.[1]||1;return `<div class="card">${title('Categorias em destaque','Participação no faturamento',`<button class="action-link" data-action="nav" data-id="products">Ver todas ${icon('chevron')}</button>`)}<div class="category-list">${entries.map(([cat,v],i)=>`<button class="category-row" data-action="category-detail" data-id="${esc(cat)}"><div class="cat-top"><span class="cat-name"><span class="cat-icon">${icon(i%2===0?'layers':'box')}</span>${esc(cat)}</span><span class="cat-val">${hide(v)}</span></div><div class="progress"><div style="width:${v/max*100}%"></div></div></button>`).join('')}</div></div>`}
function productsCard(){let a=aggregate(rowsInRange()),top=PRODUCTS.map(p=>({...p,value:a.products[p.id]||0})).sort((a,b)=>b.value-a.value).slice(0,5);return `<div class="card">${title('Produtos que mais vendem','Ranking do período',`<button class="action-link" data-action="nav" data-id="products">Explorar ${icon('arrow')}</button>`)}<div class="quick-list">${top.map((p,i)=>`<button class="quick-item" data-action="product-detail" data-id="${p.id}"><span class="quick-num">${i+1}</span><span class="quick-meta"><strong>${esc(p.name)}</strong><small>${esc(p.cat)}</small></span><span class="quick-value"><strong>${hide(p.value)}</strong><small>${integer(Math.round(p.value/p.unit))} un. est.</small></span><span class="mini-chevron">${icon('chevron')}</span></button>`).join('')}</div></div>`}
function overview(){const {now,delta}=comparison(),mp=monthProgress(),progress=mp.goal?Math.min(100,mp.percent):0;return `<div class="sections screen-enter"><div class="overview-grid"><div class="sections"><div class="hero"><div class="hero-top"><span class="hero-label">${icon('trend')} Faturamento do período</span><button class="hero-arrow" data-action="stat" data-id="revenue" aria-label="Detalhar faturamento">${icon('arrow')}</button></div><div class="hero-value">${hide(now.revenue)}</div><div class="hero-foot"><span class="change">${icon(delta!==null&&delta<0?'down':'up')} ${delta===null?'—':pct(Math.abs(delta))}</span><span>vs. período anterior</span></div><div class="hero-bottom"><div><label>Vendas registradas</label><strong>${integer(now.orders)}</strong></div><div><label>Ticket médio</label><strong>${hide(now.ticket)}</strong></div></div></div><div class="stat-grid">${statCard('orders','receipt','orange','Total de vendas',integer(now.orders),'Ver movimentações')}${statCard('ticket','wallet','blue','Ticket médio',hide(now.ticket),'Média por venda')}${statCard('margin','trend','','Margem bruta',pct(now.margin),'Estimativa demonstrativa')}${statCard('goal','target','purple','Meta mensal',pct(mp.percent),mp.percent>=100?'Meta atingida':'Toque para acompanhar')}</div></div><div class="sections"><div class="card">${title('Evolução das vendas','Toque nas barras para analisar cada período')}${barChart()}</div><div class="card">${title('Meta deste mês',`${dateLabel(monthRange().start,{month:'long',year:'numeric'})}` ,`<button class="action-link" data-action="nav" data-id="goals">Detalhes ${icon('chevron')}</button>`)}<div style="display:flex;justify-content:space-between;gap:7px;align-items:baseline"><strong style="font-size:25px;letter-spacing:-.5px">${hide(mp.value)}</strong><span class="status-chip">${pct(mp.percent)}</span></div><div class="progress" style="margin-top:14px;height:10px"><div style="width:${progress}%"></div></div><div class="progress-caption"><span>Conquistado</span><span>Meta: ${hide(mp.goal)}</span></div></div></div></div><div class="desktop-double">${storeCompare()}${categoriesCard()}</div>${productsCard()}<div class="button-row"><button class="outline-btn" data-action="export">${icon('download')} Exportar CSV</button><button class="outline-btn" data-action="share">${icon('share')} Compartilhar resumo</button></div><p class="footnote">Demonstração com dados fictícios. Valores financeiros não representam a operação real.</p></div>`}
function receiptRows(){const r=range();return receipts.filter(x=>(state.store==='all'||x.store===state.store)&&x.date>=r.start&&x.date<=r.end&&(state.pay==='all'||x.payment===state.pay)).slice(0,35)}
function sales(){const a=aggregate(rowsInRange()),payments=PAYMENTS.map(p=>({...p,value:a.payments[p.id]||0}));return `<div class="sections screen-enter"><div class="stat-grid">${statCard('revenue','trend','','Faturamento',hide(a.revenue),'Detalhar receita')}${statCard('orders','receipt','orange','Quantidade',integer(a.orders),'Vendas no período')}${statCard('ticket','wallet','blue','Ticket médio',hide(a.ticket),'Valor médio')}${statCard('margin','chart','purple','Margem bruta',pct(a.margin),'Estimativa demonstrativa')}</div><div class="card">${title('Evolução por período','Toque em uma barra para explorar os detalhes')}${barChart()}</div><div class="card">${title('Formas de pagamento','Toque para filtrar as movimentações')}<div class="pill-row">${[['all','Todas'],...PAYMENTS.map(p=>[p.id,p.name])].map(([id,label])=>`<button class="pill ${state.pay===id?'active':''}" data-action="payment" data-id="${id}">${label}</button>`).join('')}</div><div class="fin-table">${payments.filter(x=>state.pay==='all'||x.id===state.pay).map(p=>`<div class="fin-item"><span style="display:flex;align-items:center;gap:8px"><span class="store-dot" style="background:${p.color}"></span>${p.name}</span><b>${hide(p.value)}</b></div>`).join('')}</div></div><div class="card">${title('Movimentações recentes','Amostra fictícia de vendas individuais')}<div class="quick-list">${receiptRows().length?receiptRows().map(t=>`<button class="quick-item" data-action="receipt-detail" data-id="${t.id}"><span class="quick-num">${icon('receipt')}</span><span class="quick-meta"><strong>#${t.id} · ${t.store==='centro'?'Centro':'Vila Elias'}</strong><small>${dateLabel(t.date)} · ${String(t.hour).padStart(2,'0')}:${String(t.minute).padStart(2,'0')} · ${PAYMENTS.find(x=>x.id===t.payment).name}</small></span><span class="quick-value"><strong>${hide(t.value)}</strong></span><span class="mini-chevron">${icon('chevron')}</span></button>`).join(''):`<div class="empty">Nenhuma movimentação na amostra para os filtros selecionados.</div>`}</div></div><div class="note">As movimentações individuais são apenas exemplos de navegação e não constituem um livro-caixa completo. Na integração, serão substituídas por vendas reais do PostgreSQL.</div></div>`}
function productList(){const a=aggregate(rowsInRange()),base=PRODUCTS.map(p=>({...p,value:a.products[p.id]||0,quantity:Math.round((a.products[p.id]||0)/p.unit)}));let list=base.filter(p=>(state.category==='all'||p.cat===state.category)&&(!state.search||`${p.name} ${p.cat}`.toLowerCase().includes(state.search.toLowerCase())));list.sort((x,y)=>state.sort==='name'?x.name.localeCompare(y.name):state.sort==='quantity'?y.quantity-x.quantity:y.value-x.value);return list.length?list.map(p=>`<button class="product-row" data-action="product-detail" data-id="${p.id}"><span class="product-thumb ${p.cat==='Sacaria'?'orange':''}">${icon(p.icon)}</span><span class="product-info"><strong>${esc(p.name)}</strong><small>${esc(p.cat)} · ${integer(p.quantity)} un. estimadas</small></span><span class="product-amount"><strong>${hide(p.value)}</strong><small>Detalhes ${icon('chevron')}</small></span></button>`).join(''):`<div class="empty">${icon('search')}Nenhum produto encontrado. Tente outra busca ou categoria.</div>`}
function products(){const a=aggregate(rowsInRange()),top=Object.entries(a.categories).sort((x,y)=>y[1]-x[1]);return `<div class="sections screen-enter"><div class="stat-grid">${statCard('products','bag','orange','Produtos no exemplo',integer(PRODUCTS.length),'Itens do protótipo')}${statCard('revenue','trend','','Faturamento',hide(a.revenue),'Período selecionado')}</div><div class="card">${title('Categorias','Toque para abrir a análise completa')}<div class="category-list">${top.map(([c,v],i)=>`<button class="category-row" data-action="category-detail" data-id="${esc(c)}"><div class="cat-top"><span class="cat-name"><span class="cat-icon">${icon('layers')}</span>${esc(c)}</span><span class="cat-val">${hide(v)}</span></div><div class="progress"><div style="width:${a.revenue?v/a.revenue*100:0}%"></div></div></button>`).join('')}</div></div><div class="section-title top-space" style="margin-bottom:0"><div><h2>Ranking de produtos</h2><p>Pesquise, filtre e ordene</p></div><select class="select-sort" aria-label="Ordenação" id="product-sort"><option value="revenue" ${state.sort==='revenue'?'selected':''}>Maior receita</option><option value="quantity" ${state.sort==='quantity'?'selected':''}>Mais unidades</option><option value="name" ${state.sort==='name'?'selected':''}>Nome A–Z</option></select></div><label class="search-field">${icon('search')}<input id="product-search" type="search" autocomplete="off" placeholder="Buscar produto ou categoria" value="${esc(state.search)}" aria-label="Pesquisar produtos"></label><div class="pill-row">${[['all','Todas'],...CATEGORIES.map(x=>[x,x])].map(([id,label])=>`<button class="pill ${state.category===id?'active':''}" data-action="category-filter" data-id="${esc(id)}">${esc(label)}</button>`).join('')}</div><div class="product-list" id="product-results">${productList()}</div><div class="note">Quantidades dos produtos são aproximações demonstrativas. Na integração, devem vir dos itens vendidos, não da divisão entre receita e preço unitário.</div></div>`}
function donut(payments,total){const entries=PAYMENTS.map(p=>({...p,value:payments[p.id]||0})),radius=65,circum=2*Math.PI*radius;let accumulated=0;const arcs=entries.map(p=>{let part=total?p.value/total:0,segment=part*circum,offset=-accumulated;accumulated+=segment;return `<circle cx="84" cy="84" r="65" fill="none" stroke="${p.color}" stroke-width="19" stroke-dasharray="${segment.toFixed(3)} ${circum.toFixed(3)}" stroke-dashoffset="${offset.toFixed(3)}" stroke-linecap="butt"/>`}).join('');return `<div class="donut-flex"><div class="donut"><svg viewBox="0 0 168 168" aria-label="Distribuição por forma de pagamento"><circle cx="84" cy="84" r="65" fill="none" stroke="var(--line)" stroke-width="19"/>${arcs}</svg><div class="donut-center"><strong>${integer(total?100:0)}%</strong><small>das vendas</small></div></div><div class="legend">${entries.map(p=>`<button data-action="payment-detail" data-id="${p.id}"><span class="legend-label"><span class="swatch" style="background:${p.color}"></span>${p.name}</span><strong>${pct(total?p.value/total*100:0)}</strong></button>`).join('')}</div></div>`}
function finance(){const a=aggregate(rowsInRange()),net=a.profit;return `<div class="sections screen-enter"><div class="finance-hero"><label>Resultado operacional estimado</label><strong>${hide(net)}</strong><small>Receita − CMV − despesas demonstrativas · ${periodText()}</small></div><div class="stat-grid">${statCard('revenue','trend','','Receita de vendas',hide(a.revenue),'Faturamento bruto')}${statCard('cmv','box','orange','Custo estimado',hide(a.cmv),'CMV do período')}${statCard('gross','coin','blue','Lucro bruto',hide(a.gross),'Antes das despesas')}${statCard('margin','chart','purple','Margem bruta',pct(a.margin),'Lucro bruto ÷ receita')}</div><div class="card">${title('Composição do resultado','Valores demonstrativos calculados pelo período')}<div class="fin-table"><div class="fin-item"><span>Receita de vendas</span><b>${hide(a.revenue)}</b></div><div class="fin-item danger"><span>(−) CMV estimado</span><b>${hide(a.cmv)}</b></div><div class="fin-item positive"><span>(=) Lucro bruto</span><b>${hide(a.gross)}</b></div><div class="fin-item danger"><span>(−) Despesas estimadas</span><b>${hide(a.expenses)}</b></div><div class="fin-item ${net<0?'danger':'positive'}"><span><strong>Resultado estimado</strong></span><b>${hide(net)}</b></div></div></div><div class="card">${title('Recebimentos por forma','Distribuição demonstrativa das vendas')}${donut(a.payments,a.revenue)}</div><div class="note">Atenção: valores simulados. No SistVale real, faturamento, recebimentos, despesas, fiado, CMV e lucro devem usar suas próprias fontes e regras de competência, sem misturar conceitos.</div></div>`}
function goals(){const mp=monthProgress(),remainingDay=Math.max(1,monthDays()-today.getDate()),needed=mp.remaining/remainingDay;return `<div class="sections screen-enter"><div class="goal-card"><p>${icon('target')} Meta mensal · ${padStore(state.store)}</p><h2>${hide(mp.goal)}</h2><span class="muted" style="font-size:12px">Objetivo de faturamento configurável</span><div class="progress"><div style="width:${Math.min(100,mp.percent)}%"></div></div><div class="goal-progress"><span>${hide(mp.value)} realizados</span><strong>${pct(mp.percent)}</strong></div></div><div class="goal-mini"><div><label>Falta para a meta</label><strong>${hide(mp.remaining)}</strong></div><div><label>Projeção do mês</label><strong>${hide(mp.projection,shortMoney)}</strong></div><div><label>Média diária necessária</label><strong>${hide(needed,shortMoney)}</strong></div><div><label>Dias restantes</label><strong>${integer(Math.max(0,monthDays()-today.getDate()))}</strong></div></div><button class="primary-btn" data-action="edit-goal">${icon('edit')} Ajustar metas das lojas</button><div class="card">${title('Meta por loja','Acompanhamento individual no mês')}<div class="comparison">${STORES.map((s,i)=>{const v=aggregate(rowsInRange(monthRange(),s.id)).revenue,g=Number(state.goals[s.id])||0;return `<div><div class="store-row" style="pointer-events:none"><h3><span class="store-dot ${i?'orange':''}"></span>${s.name}</h3><strong>${hide(v)} / ${hide(g)}</strong></div><div class="progress ${i?'orange':''}"><div style="width:${g?Math.min(100,v/g*100):0}%"></div></div><div class="progress-caption"><span>${pct(g?v/g*100:0)} da meta</span><span>${hide(Math.max(0,g-v))} restantes</span></div></div>`}).join('')}</div></div><div class="note">As metas deste protótipo ficam salvas apenas neste navegador. Na integração, o Cursor deverá usar configurações por loja no servidor, conforme as regras de acesso.</div></div>`}
function render(keepPosition=false){document.body.classList.toggle('dark',state.dark);let priorY=window.scrollY;document.getElementById('app').innerHTML=buildTop()+(state.view==='overview'?overview():state.view==='sales'?sales():state.view==='products'?products():state.view==='finance'?finance():goals())+bottomNav();if(!keepPosition)window.scrollTo({top:0,behavior:'instant'});else window.scrollTo({top:priorY,behavior:'instant'});save()}
function showSheet(titleText,content){const portal=document.getElementById('portal');portal.innerHTML=`<div class="overlay" data-action="overlay-close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titleText)}"><div class="sheet-head"><div class="handle"></div><div class="sheet-title"><h2>${esc(titleText)}</h2><button class="sheet-close" data-action="close-sheet" aria-label="Fechar">${icon('close')}</button></div></div><div class="sheet-body">${content}</div></div></div>`;document.body.style.overflow='hidden'}
function closeSheet(){document.getElementById('portal').innerHTML='';document.body.style.overflow=''}
let toastTimer;function toast(s){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=s;document.body.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3000)}
function detailGrid(vals){return `<div class="detail-grid">${vals.map(([title,value])=>`<div><label>${esc(title)}</label><strong>${value}</strong></div>`).join('')}</div>`}
function statDetail(id){const a=aggregate(rowsInRange()),mp=monthProgress(),desc={revenue:['Faturamento do período',hide(a.revenue),'Soma demonstrativa das vendas nas lojas selecionadas.'],orders:['Quantidade de vendas',integer(a.orders),'Total de operações comerciais no intervalo.'],ticket:['Ticket médio',hide(a.ticket),'Faturamento dividido pelo número de vendas.'],margin:['Margem bruta',pct(a.margin),'Estimativa de (receita menos custo das mercadorias) dividida pela receita.'],cmv:['CMV estimado',hide(a.cmv),'Custos simulados; não são custos contábeis reais.'],gross:['Lucro bruto estimado',hide(a.gross),'Receita menos CMV estimado.'],goal:['Meta mensal',pct(mp.percent),'Percentual alcançado da meta do mês corrente.'],products:['Produtos demonstrativos',integer(PRODUCTS.length),'Itens incluídos apenas para exercitar busca e navegação.']};const [heading,value,text]=desc[id]||desc.revenue;showSheet(heading,`<div class="detail-amount">${value}</div><p class="detail-sub">${text}</p>${detailGrid([['Loja',padStore(state.store)],['Período',periodText()],['Vendas',integer(a.orders)],['Ticket médio',hide(a.ticket)]])}<button class="primary-btn" data-action="nav-close" data-id="${id==='goal'?'goals':id==='products'?'products':id==='margin'||id==='gross'||id==='cmv'?'finance':'sales'}">${icon('arrow')} Explorar detalhes</button>`)}
function bucketDetail(i){const b=buckets()[i];if(!b)return;const a=b.totals;showSheet('Detalhes do período',`<p class="detail-sub">${dateLabel(b.start,{day:'2-digit',month:'long',year:'numeric'})} até ${dateLabel(b.end,{day:'2-digit',month:'long',year:'numeric'})} · ${padStore(state.store)}</p><div class="detail-amount">${hide(a.revenue)}</div>${detailGrid([['Vendas',integer(a.orders)],['Ticket médio',hide(a.ticket)],['Margem bruta',pct(a.margin)],['Resultado est.',hide(a.profit)]])}<h3 style="font-size:14px;margin:15px 0 10px">Categorias</h3><div class="fin-table">${Object.entries(a.categories).sort((x,y)=>y[1]-x[1]).slice(0,5).map(([k,v])=>`<div class="fin-item"><span>${esc(k)}</span><b>${hide(v)}</b></div>`).join('')}</div>`)}
function categoryDetail(cat){const a=aggregate(rowsInRange()),v=a.categories[cat]||0;const prods=PRODUCTS.filter(p=>p.cat===cat).map(p=>({...p,value:a.products[p.id]||0})).sort((x,y)=>y.value-x.value);showSheet(cat,`<p class="detail-sub">Vendas da categoria · ${periodText()}</p><div class="detail-amount">${hide(v)}</div>${detailGrid([['Participação',pct(a.revenue?v/a.revenue*100:0)],['Produtos no exemplo',integer(prods.length)]])}<h3 style="font-size:14px;margin-bottom:12px">Produtos desta categoria</h3><div class="fin-table">${prods.map(p=>`<div class="fin-item"><span>${esc(p.name)}</span><b>${hide(p.value)}</b></div>`).join('')}</div><button class="primary-btn" style="margin-top:16px" data-action="category-apply" data-id="${esc(cat)}">${icon('search')} Filtrar produtos</button>`)}
function productDetail(id){const p=PRODUCTS.find(x=>x.id===Number(id));if(!p)return;const a=aggregate(rowsInRange()),v=a.products[p.id]||0;const c=STORES.map(s=>({name:s.name,value:aggregate(rowsInRange(range(),s.id)).products[p.id]||0}));showSheet('Detalhes do produto',`<p class="detail-sub">${esc(p.name)} · ${esc(p.cat)}</p><div class="detail-amount">${hide(v)}</div>${detailGrid([['Unidades estimadas',integer(Math.round(v/p.unit))],['Preço demonstrativo',money(p.unit)],['Participação na categoria',pct(a.categories[p.cat]?v/a.categories[p.cat]*100:0)],['Período',periodText()]])}<h3 style="font-size:14px;margin-bottom:8px">Por loja</h3><div class="fin-table">${c.map(s=>`<div class="fin-item"><span>${s.name}</span><b>${hide(s.value)}</b></div>`).join('')}</div><p class="detail-sub" style="margin-top:16px">Produto fictício/composição de exemplo. Na versão integrada, usar código GM, EAN, quantidade e valores reais dos itens de venda.</p>`)}
function receiptDetail(id){const t=receipts.find(x=>x.id===Number(id));if(!t)return;showSheet('Venda demonstrativa #'+id,`<p class="detail-sub">${dateLabel(t.date,{day:'2-digit',month:'long',year:'numeric'})} às ${String(t.hour).padStart(2,'0')}:${String(t.minute).padStart(2,'0')}</p><div class="detail-amount">${hide(t.value)}</div>${detailGrid([['Loja',t.store==='centro'?'Centro':'Vila Elias'],['Pagamento',PAYMENTS.find(p=>p.id===t.payment)?.name||'-'],['Referência','#'+t.id],['Origem','Simulação']])}<div class="note">Movimentação ilustrativa. Não é um cupom fiscal, nota ou venda existente no SistVale.</div>`)}
function paymentDetail(id){const p=PAYMENTS.find(x=>x.id===id),a=aggregate(rowsInRange());if(!p)return;showSheet(p.name,`<p class="detail-sub">Participação no faturamento demonstrativo</p><div class="detail-amount">${hide(a.payments[id]||0)}</div>${detailGrid([['Participação',pct(a.revenue?(a.payments[id]||0)/a.revenue*100:0)],['Período',periodText()]])}<button class="primary-btn" data-action="payment-apply" data-id="${id}">${icon('filter')} Filtrar vendas</button>`)}
function periodSheet(){showSheet('Selecionar período',`<p class="detail-sub" style="margin-bottom:15px">Escolha um intervalo para atualizar todas as telas.</p><div class="pill-row" style="flex-wrap:wrap">${[['7','7 dias'],['30','30 dias'],['90','90 dias'],['365','12 meses']].map(([v,l])=>`<button class="pill ${state.period===v?'active':''}" data-action="period" data-id="${v}">${l}</button>`).join('')}</div><div style="margin:19px 0 15px;border-top:1px solid var(--line)"></div><form id="custom-period-form" class="form-stack"><div class="field-grid"><label><span class="field-label">Data inicial</span><input class="field-input" type="date" name="start" required max="${todayKey}" value="${state.customStart||dayKey(addDays(today,-29))}"></label><label><span class="field-label">Data final</span><input class="field-input" type="date" name="end" required max="${todayKey}" value="${state.customEnd||todayKey}"></label></div><button type="submit" class="primary-btn">${icon('calendar')} Aplicar datas</button></form><p class="detail-sub" style="margin-top:14px">Os dados de exemplo cobrem aproximadamente 13 meses anteriores a hoje.</p>`)}
function editGoal(){showSheet('Configurar metas mensais',`<p class="detail-sub" style="margin-bottom:18px">Os valores são gravados apenas neste navegador demonstrativo.</p><form id="goal-form" class="form-stack"><label><span class="field-label">Meta mensal · Centro (R$)</span><input class="field-input" type="number" min="0" step="100" name="centro" value="${state.goals.centro}" required></label><label><span class="field-label">Meta mensal · Vila Elias (R$)</span><input class="field-input" type="number" min="0" step="100" name="vila" value="${state.goals.vila}" required></label><button class="primary-btn" type="submit">${icon('check')} Salvar metas demonstrativas</button></form>`)}
function options(){showSheet('Opções do painel',`<div class="form-stack"><button class="outline-btn" style="justify-content:flex-start" data-action="toggle-theme">${icon(state.dark?'sun':'moon')} ${state.dark?'Usar tema claro':'Usar tema escuro'}</button><button class="outline-btn" style="justify-content:flex-start" data-action="toggle-hide">${icon(state.hidden?'eyeoff':'eye')} ${state.hidden?'Mostrar valores':'Ocultar valores'}</button><button class="outline-btn" style="justify-content:flex-start" data-action="export">${icon('download')} Exportar dados demonstrativos em CSV</button><button class="outline-btn" style="justify-content:flex-start" data-action="share">${icon('share')} Compartilhar resumo demonstrativo</button></div><p class="detail-sub" style="margin-top:23px">SistApp Dashboard · Protótipo independente, sem acesso ao PostgreSQL e sem ações de escrita no sistema.</p>`)}
function exportCsv(){const r=range(),filtered=rowsInRange(),headers=['Data','Loja','Faturamento','Vendas','CMV estimado','Despesas estimadas','Resultado estimado'];const lines=[headers,...filtered.map(d=>[d.date,d.store==='centro'?'Centro':'Vila Elias',d.revenue,d.orders,d.cmv,d.expenses,round(d.revenue-d.cmv-d.expenses)])];const content='\ufeff'+lines.map(a=>a.map(v=>`"${String(v).replaceAll('"','""')}"`).join(';')).join('\r\n');const blob=new Blob([content],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`sistapp-demonstracao-${r.start}-${r.end}.csv`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('CSV demonstrativo gerado')}
async function share(){const a=aggregate(rowsInRange()),txt=`SistApp · DEMONSTRAÇÃO (dados fictícios)\n${padStore(state.store)} · ${periodText()}\nFaturamento: ${money(a.revenue)}\nVendas: ${a.orders}\nTicket médio: ${money(a.ticket)}`;try{if(navigator.share){await navigator.share({title:'SistApp - resumo demonstrativo',text:txt})}else if(navigator.clipboard){await navigator.clipboard.writeText(txt);toast('Resumo copiado')}else toast('Compartilhamento indisponível neste navegador')}catch(e){if(e.name!=='AbortError')toast('Não foi possível compartilhar')}}
function navigate(v){state.view=v;state.selectedBucket=-1;closeSheet();render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;if(action==='overlay-close'){if(e.target===el)closeSheet();return}if(action==='close-sheet'){closeSheet();return}if(action==='nav'){navigate(id);return}if(action==='nav-close'){navigate(id);return}if(action==='store'){state.store=id;state.selectedBucket=-1;render(true);return}if(action==='period-sheet'){periodSheet();return}if(action==='period'){state.period=id;state.selectedBucket=-1;closeSheet();render(true);return}if(action==='metric'){state.metric=id;render(true);return}if(action==='bucket'){state.selectedBucket=Number(id);render(true);return}if(action==='bucket-detail'){bucketDetail(Number(id));return}if(action==='stat'){statDetail(id);return}if(action==='category-detail'){categoryDetail(id);return}if(action==='category-apply'){state.category=id;state.search='';navigate('products');return}if(action==='category-filter'){state.category=id;document.getElementById('product-results').innerHTML=productList();document.querySelectorAll('[data-action="category-filter"]').forEach(b=>b.classList.toggle('active',b.dataset.id===id));return}if(action==='product-detail'){productDetail(id);return}if(action==='receipt-detail'){receiptDetail(id);return}if(action==='payment'){state.pay=id;render(true);return}if(action==='payment-detail'){paymentDetail(id);return}if(action==='payment-apply'){state.pay=id;navigate('sales');return}if(action==='edit-goal'){editGoal();return}if(action==='refresh'){render(true);toast('Visualização atualizada · dados demonstrativos');return}if(action==='toggle-hide'){state.hidden=!state.hidden;closeSheet();render(true);return}if(action==='toggle-theme'){state.dark=!state.dark;closeSheet();render(true);return}if(action==='options'){options();return}if(action==='export'){exportCsv();return}if(action==='share'){share();return}});
document.addEventListener('input',e=>{if(e.target.id==='product-search'){state.search=e.target.value;const result=document.getElementById('product-results');if(result)result.innerHTML=productList()}});
document.addEventListener('change',e=>{if(e.target.id==='product-sort'){state.sort=e.target.value;const result=document.getElementById('product-results');if(result)result.innerHTML=productList()}});
document.addEventListener('submit',e=>{if(e.target.id==='custom-period-form'){e.preventDefault();let data=new FormData(e.target),s=data.get('start'),end=data.get('end');const minDate=dayKey(addDays(today,-405));if(s>end){toast('Data inicial deve ser anterior à final');return}if(s<minDate||end>todayKey){toast('Escolha datas dentro do intervalo demonstrativo');return}state.customStart=s;state.customEnd=end;state.period='custom';state.selectedBucket=-1;closeSheet();render(true)}if(e.target.id==='goal-form'){e.preventDefault();let data=new FormData(e.target),c=Number(data.get('centro')),v=Number(data.get('vila'));if(c<=0||v<=0||!Number.isFinite(c)||!Number.isFinite(v)){toast('Digite metas válidas');return}state.goals={centro:c,vila:v};closeSheet();render(true);toast('Metas demonstrativas salvas')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
render();
})();
</script>
</body>
</html>
