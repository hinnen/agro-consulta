# Blueprint Render — Web Service HTTP público.
# Após commit, no painel: New → Blueprint (ou vincule este repo ao serviço existente).
# Ajuste o nome do serviço se quiser.
#
# Cron de ping Mongo: roda em processo separado (não atende usuários do PDV). Anexe ao
# serviço cron o mesmo Environment Group do web (Mongo, DATABASE_URL, DJANGO_SETTINGS_MODULE, etc.).
services:
  # PRODUÇÃO — branch producao → serviço "Sistvale - Produção" no painel Render.
  - type: web
    name: agro-consulta
    branch: producao
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/record_deploy.py && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python scripts/producao_financeiro_pg_bootstrap.py
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --preload --timeout 180 --graceful-timeout 45 --no-control-socket --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    # Produção com domínio próprio: AGRO_CANONICAL_ORIGIN=https://www.example.com.br
    # WhatsApp em serviço à parte: AGRO_WA_PUBLIC_ORIGIN=https://<agro-consulta-teste>.onrender.com
    # Redis (opcional): REDIS_URL no mesmo env do web.
    # Painel exige login (padrão). Abrir sem login: AGRO_PUBLIC_DASHBOARD=true

  # WhatsApp na loja (reaproveite este serviço no painel — ex. agro-consulta-staging / agro-consulta-teste).
  # Não é mais PDV de teste: branch producao, DATABASE_URL da LOJA, sem AGRO_STAGING_READONLY.
  # Plano Starter (~US$ 7). Ver docs/DEPLOY-WHATSAPP-RENDER.md
  - type: web
    name: agro-consulta-teste
    branch: producao
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/record_deploy.py && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python scripts/producao_financeiro_pg_bootstrap.py
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --preload --timeout 180 --graceful-timeout 45 --no-control-socket --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    # Só WhatsApp: NÃO definir AGRO_WA_PUBLIC_ORIGIN aqui. Sem AGRO_STAGING_READONLY / AGRO_ERP_PEDIDOS_DRY_RUN.

  - type: cron
    name: agro-estoque-mongo-ping
    runtime: python
    # A cada 10 min: um find_one no Mongo + gravação em EstoqueSyncHealth (erros acumulam em falhas_sequenciais_mongo).
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py estoque_mongo_ping

  # RH: títulos de salário no CP no dia configurado por funcionário (competência = mês anterior).
  - type: cron
    name: agro-rh-envio-cp-automatico
    branch: producao
    runtime: python
    schedule: "15 6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py rh_envio_cp_automatico

  # Ping /healthz do staging — mesma rotina no final de estoque_mongo_ping (evita serviço cron extra).
  # Se o Blueprint não sincronizar sozinho, confira no painel Render que o cron existe e branch teste.

  # Backup Postgres noturno (produção): anexe o Environment Group da LOJA.
  # Habilitar: AGRO_PG_BACKUP_NIGHTLY_ENABLED=true + AGRO_PG_BACKUP_UPLOAD_MODE (webhook ou s3).
  - type: cron
    name: agro-pg-backup-nightly
    branch: producao
    runtime: python
    schedule: "0 7 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py pg_backup_nightly
