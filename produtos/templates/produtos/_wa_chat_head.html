{# Cabeçalho do chat — só aparece com conversa aberta #}
<div id="wa-chat-head" class="wa-chat-head is-empty">
  <p class="wa-chat-empty">Selecione uma conversa à esquerda</p>
  <div class="wa-chat-on">
    <button type="button" id="wa-topo-who" class="wa-chat-who" title="Ver dados do contato">
      <span id="wa-topo-av" class="wa-topo-av"><span id="wa-topo-ini">?</span></span>
      <span id="wa-topo-nome" class="wa-topo-nome">Conversa</span>
    </button>
    <div class="wa-chat-tools">
      <button type="button" id="wa-topo-status" class="wa-st-chip hidden" title="Ver status deste contato">
        <span class="wa-st-chip-ring"><span id="wa-topo-st-ini" class="wa-st-chip-ini">S</span></span>
        <span class="wa-st-chip-txt">Status</span>
      </button>
      <div class="wa-chat-actions">
        <button type="button" id="wa-hist" class="wa-act" title="Puxar uns dias deste chat">Anteriores</button>
        <button type="button" id="wa-ok" class="wa-act wa-act-ok" title="Arquivar (Resolvidas)">✓</button>
        <button type="button" id="wa-reabrir" class="wa-act hidden" title="Voltar para a fila da loja">Reabrir</button>
        <button type="button" id="wa-del" class="wa-act wa-act-del" title="Apagar esta conversa da lista">Apagar</button>
      </div>
    </div>
  </div>
</div>
