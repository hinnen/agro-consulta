{# Barra de enviar — texto + foto + mic + Enviar (PC e celular). #}
<button type="button" id="wa-foto" class="wa-ico" title="Enviar foto">Foto</button>
<input id="wa-foto-inp" type="file" accept="image/*"{% if wa_cel_capture %} capture="environment"{% endif %} class="sr-only" tabindex="-1" />
<button type="button" id="wa-mic" class="wa-ico" title="Gravar áudio">Mic</button>
<button type="button" id="wa-mic-x" class="wa-ico hidden" title="Cancelar gravação">X</button>
<button type="button" id="wa-audio-arq" class="wa-ico hidden" title="Enviar áudio">Áudio</button>
<input id="wa-audio-inp" type="file" accept="audio/*" class="sr-only" tabindex="-1" />
<input id="wa-input" type="text" maxlength="4000" autocomplete="off" placeholder="Mensagem" inputmode="text" class="min-h-[2.85rem] min-w-0 flex-1 rounded-2xl border border-slate-200 bg-slate-50 px-3 text-base font-semibold" />
<button type="submit" id="wa-send" class="min-h-[2.85rem] min-w-[5.2rem] rounded-2xl bg-[#25d366] px-4 text-sm font-extrabold text-white">Enviar</button>
