{# Filtros da lista WhatsApp — horário (padrão) · espera · novas. #}
<div class="wa-filtros" id="wa-filtros" role="toolbar" aria-label="Filtrar conversas">
  <button type="button" class="wa-filtro is-on" data-filtro="hora" title="Por horário (padrão do Zap)" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 1.5"/></svg>
  </button>
  <button type="button" class="wa-filtro wa-filtro-espera" data-filtro="espera" title="Aguardando resposta (laranja)" aria-pressed="false">
    <span class="wa-filtro-dot" aria-hidden="true"></span>
    <span class="wa-filtro-n is-zero" data-filtro-n="espera">0</span>
  </button>
  <button type="button" class="wa-filtro wa-filtro-nova" data-filtro="nova" title="Mensagens novas (verde)" aria-pressed="false">
    <span class="wa-filtro-dot" aria-hidden="true"></span>
    <span class="wa-filtro-n is-zero" data-filtro-n="nova">0</span>
  </button>
  <button type="button" id="wa-marcar" class="wa-filtro" title="Marcar várias conversas para agir de uma vez" aria-pressed="false">Marcar</button>
</div>
<div id="wa-selbar" class="wa-selbar" hidden>
  <span id="wa-sel-n">0 marcadas</span>
  <button type="button" id="wa-sel-todas">Todas desta lista</button>
  <button type="button" id="wa-sel-arq" class="wa-sel-go">Arquivar</button>
  <button type="button" id="wa-sel-reab" class="wa-sel-go">Reabrir</button>
  <button type="button" id="wa-sel-lidas">Marcar lidas</button>
  <button type="button" id="wa-sel-del" class="wa-sel-del">Apagar</button>
  <button type="button" id="wa-sel-fim">Cancelar</button>
</div>
