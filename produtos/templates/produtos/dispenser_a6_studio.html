{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" data-cat="cao-adulto-pequeno">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dispenser A6 · GM Agro Mais</title>
  <link rel="stylesheet" href="{% static 'produtos/dispenser-a6/dispenser.css' %}" />
</head>
<body>
  <div class="dsp-studio">
    <aside class="dsp-panel no-print">
      <h1>Dispenser A6</h1>
      <p class="dsp-hint">Escolha categoria, pet, ingredientes e imprima. Depois ligamos no sistema.</p>

      <div class="dsp-field">
        <label for="dspCat">Categoria (cor)</label>
        <select id="dspCat">
          <option value="cao-adulto-pequeno">Cão adulto · raças pequenas</option>
          <option value="cao-adulto-medio">Cão adulto · médias e grandes</option>
          <option value="cao-filhote-pequeno">Cão filhote · raças pequenas</option>
          <option value="cao-filhote-medio">Cão filhote · médias e grandes</option>
          <option value="cao-senior">Cão sênior</option>
          <option value="gato-castrado">Gato castrado</option>
          <option value="gato-adulto">Gato adulto (sem castrar)</option>
          <option value="gato-filhote">Gato filhote</option>
        </select>
      </div>

      <div class="dsp-field">
        <label for="dspBrand">Marca</label>
        <input id="dspBrand" type="text" value="Robustus" maxlength="40" />
      </div>

      <div class="dsp-field">
        <label for="dspFlavors">Sabores (um por linha)</label>
        <textarea id="dspFlavors">Carne
Frango
Batata doce</textarea>
      </div>

      <div class="dsp-field">
        <label for="dspProtein">Proteína (%)</label>
        <input id="dspProtein" type="text" value="32" maxlength="6" inputmode="decimal" />
      </div>

      <div class="dsp-gal-label">Biblioteca de cães e gatos</div>
      <div class="dsp-gal" id="dspPetGal" role="listbox" aria-label="Escolher pet"></div>

      <div class="dsp-gal-label">Biblioteca de ingredientes</div>
      <div class="dsp-gal dsp-gal--ings" id="dspIngGal" role="listbox" aria-label="Escolher ingredientes"></div>

      <div class="dsp-actions">
        <button type="button" id="dspPrint">Imprimir A6</button>
        <button type="button" class="secondary" id="dspReset">Exemplo</button>
      </div>
    </aside>

    <main class="dsp-stage">
      <div class="dsp-stage-label no-print">Prévia · 105 × 148 mm</div>

      <article class="dsp-a6" id="dspCard">
        <header class="dsp-header">
          <div class="dsp-header-text" id="dspHeaderText">
            <span class="dsp-line1">Cão adulto</span>
            <span class="dsp-line2">Raças pequenas</span>
          </div>
        </header>

        <section class="dsp-hero">
          <div class="dsp-brand">
            <div class="dsp-brand-name" id="dspBrandOut">Robustus</div>
          </div>
          <div class="dsp-pet">
            <img id="dspPetImg" src="{% static 'produtos/dispenser-a6/lib/pets/chihuahua.jpg' %}" alt="" />
          </div>
        </section>

        <section class="dsp-sabores">
          <h2 class="dsp-sabores-title">Sabores</h2>
          <div class="dsp-sabores-grid">
            <div class="dsp-ing-photo">
              <img id="dspIngImg" src="{% static 'produtos/dispenser-a6/lib/ings/carne-frango-batata.jpg' %}" alt="" />
            </div>
            <ul class="dsp-flavor-list" id="dspFlavorList"></ul>
          </div>
        </section>

        <div class="dsp-protein-row">
          <div class="dsp-protein" id="dspProteinBubble">
            <span class="dsp-protein-label">Proteína bruta</span>
            <span class="dsp-protein-main" id="dspProteinOut">32%</span>
            <span class="dsp-protein-stars" aria-hidden="true">★★★</span>
          </div>
        </div>
      </article>
    </main>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="ico-carne" viewBox="0 0 24 24"><path fill="none" stroke="#5a3a2a" stroke-width="1.6" d="M7.5 9.5c0-2 2-3.5 4.5-3.5s4.5 1.5 4.5 3.5c0 .9-.4 1.7-1 2.3V17a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-5.2c-.6-.6-1-1.4-1-2.3z"/><circle fill="none" stroke="#5a3a2a" stroke-width="1.4" cx="12" cy="9.5" r="1.6"/></symbol>
    <symbol id="ico-frango" viewBox="0 0 24 24"><path fill="none" stroke="#b45309" stroke-width="1.6" d="M9 10c0-2.2 1.8-4 4-4 1.5 0 2.8.8 3.5 2L19 7.2c.4-.5 1.2-.4 1.5.2.2.4.1.9-.3 1.2l-2.2 1.6c.2.5.3 1 .3 1.5 0 2.5-2 4.5-4.5 4.5S9.3 14.7 9.3 12.2c0-.7.2-1.4.5-2L8 9.2"/><path fill="none" stroke="#b45309" stroke-width="1.6" d="M10.5 15.5V19a1.5 1.5 0 0 0 1.5 1.5h1A1.5 1.5 0 0 0 14.5 19v-3.2"/></symbol>
    <symbol id="ico-batata" viewBox="0 0 24 24"><ellipse fill="none" stroke="#c2410c" stroke-width="1.6" cx="12" cy="13" rx="5.5" ry="6"/><circle fill="#c2410c" cx="10" cy="11.5" r=".7"/><circle fill="#c2410c" cx="14" cy="14" r=".6"/></symbol>
    <symbol id="ico-peixe" viewBox="0 0 24 24"><path fill="none" stroke="#0369a1" stroke-width="1.6" d="M4 12s3.5-4.5 8-4.5S20 12 20 12s-3.5 4.5-8 4.5S4 12 4 12z"/><circle fill="#0369a1" cx="16.2" cy="11.3" r=".9"/><path fill="none" stroke="#0369a1" stroke-width="1.6" d="M4 12l3.2-2v4z"/></symbol>
    <symbol id="ico-abobora" viewBox="0 0 24 24"><path fill="none" stroke="#c2410c" stroke-width="1.6" d="M7.5 10.5c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5c1.4.4 2.5 1.8 2.5 3.4 0 2.2-2.2 4-5 4h-4c-2.8 0-5-1.8-5-4 0-1.6 1.1-3 2.5-3.4z"/></symbol>
    <symbol id="ico-folha" viewBox="0 0 24 24"><path fill="none" stroke="#15803d" stroke-width="1.6" d="M12 4c4 1.5 6.5 5 6.5 9.2S15.8 20 12 20 5.5 17.4 5.5 13.2 8 5.5 12 4z"/><path fill="none" stroke="#15803d" stroke-width="1.5" d="M12 6.5v11"/></symbol>
    <symbol id="ico-generico" viewBox="0 0 24 24"><circle fill="none" stroke="#64748b" stroke-width="1.6" cx="12" cy="12" r="6.5"/><circle fill="#64748b" cx="12" cy="12" r="2"/></symbol>
  </svg>

  <script>
  (function () {
    var STATIC = "{% static 'produtos/dispenser-a6/lib/' %}";

    var CAT_LABELS = {
      "cao-adulto-pequeno": ["Cão adulto", "Raças pequenas"],
      "cao-adulto-medio": ["Cão adulto", "Raças médias e grandes"],
      "cao-filhote-pequeno": ["Cão filhote", "Raças pequenas"],
      "cao-filhote-medio": ["Cão filhote", "Raças médias e grandes"],
      "cao-senior": ["Cão sênior", "Todas as raças"],
      "gato-castrado": ["Gato castrado", "Adulto"],
      "gato-adulto": ["Gato adulto", "Sem castrar"],
      "gato-filhote": ["Gato filhote", ""]
    };

    var PETS = [
      { id: "chihuahua", file: "pets/chihuahua.jpg", label: "Pequeno" },
      { id: "beagle", file: "pets/beagle.jpg", label: "Beagle" },
      { id: "golden", file: "pets/golden.jpg", label: "Golden" },
      { id: "medio", file: "pets/medio.jpg", label: "Médio" },
      { id: "gato-cinza", file: "pets/gato-cinza.jpg", label: "Gato" },
      { id: "gato-laranja", file: "pets/gato-laranja.jpg", label: "Persa" },
      { id: "gatinho", file: "pets/gatinho.jpg", label: "Filhote" }
    ];

    var INGS = [
      { id: "carne-frango-batata", file: "ings/carne-frango-batata.jpg", flavors: "Carne\nFrango\nBatata doce" },
      { id: "peixe", file: "ings/peixe.jpg", flavors: "Peixe\nSalmão" },
      { id: "carne-abobora", file: "ings/carne-abobora.jpg", flavors: "Carne\nAbóbora" },
      { id: "frango-cenoura", file: "ings/frango-cenoura.jpg", flavors: "Frango\nCenoura\nArroz" },
      { id: "carne-legumes", file: "ings/carne-legumes.jpg", flavors: "Carne\nBatata doce\nLegumes" }
    ];

    var FLAVOR_ICON = {
      carne: "ico-carne", frango: "ico-frango", "batata doce": "ico-batata", "batata-doce": "ico-batata",
      peixe: "ico-peixe", salmao: "ico-peixe", salmão: "ico-peixe", abobora: "ico-abobora", abóbora: "ico-abobora",
      arroz: "ico-folha", cenoura: "ico-folha", legumes: "ico-folha", graos: "ico-folha", grãos: "ico-folha"
    };

    var root = document.documentElement;
    var catEl = document.getElementById("dspCat");
    var brandEl = document.getElementById("dspBrand");
    var flavorsEl = document.getElementById("dspFlavors");
    var proteinEl = document.getElementById("dspProtein");
    var headerText = document.getElementById("dspHeaderText");
    var brandOut = document.getElementById("dspBrandOut");
    var flavorList = document.getElementById("dspFlavorList");
    var proteinOut = document.getElementById("dspProteinOut");
    var proteinBubble = document.getElementById("dspProteinBubble");
    var petImg = document.getElementById("dspPetImg");
    var ingImg = document.getElementById("dspIngImg");
    var petGal = document.getElementById("dspPetGal");
    var ingGal = document.getElementById("dspIngGal");
    var petId = "chihuahua";
    var ingId = "carne-frango-batata";

    function iconFor(name) {
      return FLAVOR_ICON[String(name || "").trim().toLowerCase()] || "ico-generico";
    }

    function buildGal(el, items, kind) {
      el.innerHTML = "";
      items.forEach(function (it) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "dsp-gal-item";
        btn.setAttribute("role", "option");
        btn.title = it.label || it.id;
        btn.dataset.id = it.id;
        btn.innerHTML = '<img src="' + STATIC + it.file + '" alt="" />';
        btn.addEventListener("click", function () {
          if (kind === "pet") {
            petId = it.id;
            petImg.src = STATIC + it.file;
          } else {
            ingId = it.id;
            ingImg.src = STATIC + it.file;
            if (it.flavors) flavorsEl.value = it.flavors;
            renderFlavors();
          }
          syncGal();
        });
        el.appendChild(btn);
      });
    }

    function syncGal() {
      Array.prototype.forEach.call(petGal.children, function (b) {
        b.classList.toggle("is-on", b.dataset.id === petId);
      });
      Array.prototype.forEach.call(ingGal.children, function (b) {
        b.classList.toggle("is-on", b.dataset.id === ingId);
      });
    }

    function renderFlavors() {
      var lines = String(flavorsEl.value || "").split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 5);
      flavorList.innerHTML = "";
      lines.forEach(function (name) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="dsp-flavor-ico"><svg viewBox="0 0 24 24"><use href="#' + iconFor(name) + '"></use></svg></span>';
        var span = document.createElement("span");
        span.textContent = name;
        li.appendChild(span);
        flavorList.appendChild(li);
      });
    }

    function renderProtein() {
      var n = parseFloat(String(proteinEl.value || "").trim().replace(",", ".").replace("%", ""));
      if (!isFinite(n) || n <= 0) {
        proteinBubble.classList.add("is-empty");
        proteinOut.textContent = "%";
        return;
      }
      proteinBubble.classList.remove("is-empty");
      proteinOut.textContent = (Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10)) + "%";
    }

    function renderAll() {
      var cat = catEl.value;
      root.setAttribute("data-cat", cat);
      var labels = CAT_LABELS[cat] || ["Categoria", ""];
      headerText.innerHTML = '<span class="dsp-line1">' + labels[0] + '</span>' +
        (labels[1] ? '<span class="dsp-line2">' + labels[1] + '</span>' : '');
      brandOut.textContent = String(brandEl.value || "").trim() || "Sua marca";
      renderFlavors();
      renderProtein();
      syncGal();
    }

    buildGal(petGal, PETS, "pet");
    buildGal(ingGal, INGS, "ing");

    catEl.addEventListener("change", renderAll);
    brandEl.addEventListener("input", renderAll);
    flavorsEl.addEventListener("input", renderAll);
    proteinEl.addEventListener("input", renderAll);
    document.getElementById("dspPrint").addEventListener("click", function () { window.print(); });
    document.getElementById("dspReset").addEventListener("click", function () {
      catEl.value = "cao-adulto-pequeno";
      brandEl.value = "Robustus";
      flavorsEl.value = "Carne\nFrango\nBatata doce";
      proteinEl.value = "32";
      petId = "chihuahua";
      ingId = "carne-frango-batata";
      petImg.src = STATIC + "pets/chihuahua.jpg";
      ingImg.src = STATIC + "ings/carne-frango-batata.jpg";
      renderAll();
    });

    renderAll();
  })();
  </script>
</body>
</html>
