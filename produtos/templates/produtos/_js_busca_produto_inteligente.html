{# Motor de busca de produtos (sinônimos, códigos, fuzzy) — mesmo comportamento do PDV. Incluir antes dos scripts que usam normalizarBuscaLocal / filtrarProdutosBuscaInteligente. #}
<script>
(function () {
    'use strict';
    const _buscaIndexCache = new WeakMap();

    function normalizarBuscaLocal(texto) {
        return String(texto || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .trim();
    }

    const SINONIMOS_BUSCA_PRODUTO = {
        racao: ['alimento', 'balanceado', 'concentrado'],
        kg: ['quilo', 'kilos', 'kilo', 'kgs'],
        quilo: ['kg', 'kilos', 'kilo'],
        kilo: ['kg', 'quilo'],
        litro: ['lt', 'lts', 'ltr'],
        un: ['und', 'unidade', 'uni'],
        und: ['un', 'unidade'],
        adubo: ['fertilizante', 'fertil'],
        fertilizante: ['adubo'],
    };

    function textoBuscaProdutoNormalizado(p) {
        return normalizarBuscaLocal(String(p && p.busca_texto ? p.busca_texto : ''));
    }

    function tokensBuscaProduto(p) {
        const s = textoBuscaProdutoNormalizado(p);
        if (!s) return [];
        return s.split(/\s+/).filter(Boolean);
    }

    function buildBuscaProdutoIndex(lista) {
        const arr = Array.isArray(lista) ? lista : [];
        const cached = _buscaIndexCache.get(arr);
        if (cached && cached.len === arr.length) return cached.index;
        const tokenMap = new Map();
        const codigoMap = new Map();
        arr.forEach((p, idx) => {
            const toks = tokensBuscaProduto(p);
            toks.forEach((t) => {
                if (!t) return;
                if (!tokenMap.has(t)) tokenMap.set(t, []);
                tokenMap.get(t).push(idx);
            });
            codigosSoDigitosProduto(p).forEach((c) => {
                if (!c) return;
                if (!codigoMap.has(c)) codigoMap.set(c, []);
                codigoMap.get(c).push(idx);
            });
        });
        const index = { tokenMap, codigoMap, listRef: arr };
        _buscaIndexCache.set(arr, { len: arr.length, index });
        return index;
    }

    function _uniquePush(out, seen, idx) {
        if (idx == null) return;
        if (seen.has(idx)) return;
        seen.add(idx);
        out.push(idx);
    }

    function _indicesPorTokenParcial(index, termo) {
        const out = [];
        const seen = new Set();
        index.tokenMap.forEach((idxs, tk) => {
            if (tk === termo || tk.startsWith(termo) || tk.includes(termo)) {
                idxs.forEach((i) => _uniquePush(out, seen, i));
            }
        });
        return out;
    }

    function _indicesPorCodigo(index, digitos) {
        const out = [];
        const seen = new Set();
        index.codigoMap.forEach((idxs, code) => {
            if (code === digitos || code.startsWith(digitos) || code.endsWith(digitos) || code.includes(digitos)) {
                idxs.forEach((i) => _uniquePush(out, seen, i));
            }
        });
        return out;
    }

    function variantesPalavraBusca(palavraBruta) {
        const n = normalizarBuscaLocal(palavraBruta);
        const out = new Set();
        if (n) out.add(n);
        if (n.length < 2) return [...out];
        const extra = SINONIMOS_BUSCA_PRODUTO[n];
        if (extra) extra.forEach(x => out.add(normalizarBuscaLocal(x)));
        for (const [k, arr] of Object.entries(SINONIMOS_BUSCA_PRODUTO)) {
            if (arr.some(v => normalizarBuscaLocal(v) === n)) out.add(normalizarBuscaLocal(k));
        }
        return [...out].filter(Boolean);
    }

    function codigosSoDigitosProduto(p) {
        const raw = [
            p.codigo_nfe,
            p.codigo_barras,
            p.codigo,
            p.ean,
            p.referencia,
            p.sku,
            p.codigo_fornecedor,
            p.codigo_interno,
        ];
        if (Array.isArray(p.index_codigos)) {
            p.index_codigos.forEach((x) => raw.push(x));
        }
        return raw
            .map(x => String(x ?? '').replace(/\D/g, ''))
            .filter(c => c.length > 0);
    }

    function gmAlnumEquivalente(a, b) {
        if (!a || !b) return false;
        if (a === b) return true;
        if (a.length >= 5 && b.length >= 5) {
            const sa = a.replace(/[^a-z0-9]/g, '');
            const sb = b.replace(/[^a-z0-9]/g, '');
            if (sa === sb) return true;
            /* Sufixo ensacado (S) ou hífen na etiqueta: gm15415 ≈ gm15415s */
            const core = (s) => (s.length > 5 && /^[a-z]$/.test(s.slice(-1)) ? s.slice(0, -1) : s);
            if (core(sa) === core(sb) && Math.abs(sa.length - sb.length) <= 1) return true;
        }
        return false;
    }

    function variantesLiteraisCodigoGm(raw) {
        const n = normalizarBuscaLocal(String(raw || '').trim());
        const out = new Set();
        if (!n || !n.startsWith('gm')) return [];
        out.add(n);
        const al = somenteAlnumCodigoBusca(n);
        if (al.length >= 5) out.add(al);
        /* Cadastro GM15415S ↔ etiqueta GM1541-5S (mesmo alnum, hífen na impressão). */
        const m = al.match(/^gm(\d{3,})([a-z]?)$/);
        if (m) {
            const digits = m[1];
            const suf = m[2] || '';
            if (digits.length >= 4) {
                out.add('gm' + digits.slice(0, 4) + '-' + digits.slice(4) + suf);
                if (suf) out.add('gm' + digits + suf);
                out.add('gm' + digits);
            }
        }
        return [...out];
    }

    /** Código de barras numérico (4–14 dígitos), ex. 1813647 — distinto de EAN-13 balança. */
    function pareceCodigoBarrasNumerico(termoNorm) {
        const t = String(termoNorm || '').trim();
        return /^\d{4,14}$/.test(t);
    }

    function digitosCodigoBusca(val) {
        return String(val ?? '').replace(/\D/g, '');
    }

    /** Match exato só-dígitos em barras / index (7 dígitos, código loja, etc.). */
    function termoIgualCodigoBarrasNumericoExato(termoNorm, p) {
        const d = digitosCodigoBusca(termoNorm);
        if (!pareceCodigoBarrasNumerico(d) || !p) return false;
        const campos = [
            p.codigo_barras,
            p.ean,
            p.codigo,
            p.codigo_interno,
            p.codigo_nfe,
            p.sku,
            p.referencia,
            p.codigo_fornecedor,
        ];
        for (const val of campos) {
            if (val == null || val === '') continue;
            const vd = digitosCodigoBusca(val);
            if (vd && vd === d) return true;
        }
        if (Array.isArray(p.index_codigos)) {
            for (const x of p.index_codigos) {
                const xd = digitosCodigoBusca(x);
                if (xd && xd === d) return true;
            }
        }
        return false;
    }

    /** Prefixo GM digitado (ex. GM1541 → GM1541-5S). */
    function casaCodigoGmPrefixo(palavraNorm, p) {
        const pn = String(palavraNorm || '').trim();
        if (!pn.startsWith('gm') || pn.length < 3 || !p) return false;
        const pnAl = somenteAlnumCodigoBusca(pn);
        function bate(val) {
            if (val == null || val === '') return false;
            const vn = normalizarBuscaLocal(String(val));
            if (vn.startsWith(pn)) return true;
            const vAl = somenteAlnumCodigoBusca(vn);
            if (pnAl.length >= 3 && vAl.startsWith(pnAl)) return true;
            return false;
        }
        const campos = [p.codigo_nfe, p.codigo, p.codigo_interno, p.sku, p.referencia];
        if (campos.some(bate)) return true;
        if (Array.isArray(p.index_codigos)) {
            return p.index_codigos.some((x) => bate(x));
        }
        return false;
    }

    function parecePrefixoGm(palavraNorm) {
        const t = String(palavraNorm || '').trim();
        return /^gm[a-z0-9-]{2,50}$/.test(t);
    }

    /** Etiqueta GM (ex.: GM1541-5, GM1518-125-3) — leitor manda texto, não EAN numérico. */
    function pareceCodigoGmEtiqueta(termoNorm) {
        const t = String(termoNorm || '').trim();
        return /^gm[a-z0-9][a-z0-9-]{2,50}$/.test(t);
    }

    function termoIgualAlgumIndexCodigo(termoNorm, p) {
        if (!termoNorm || !Array.isArray(p.index_codigos)) return false;
        const t = String(termoNorm).trim();
        if (!t) return false;
        const tAl = somenteAlnumCodigoBusca(t);
        return p.index_codigos.some((x) => {
            const xn = normalizarBuscaLocal(String(x ?? ''));
            if (xn === t) return true;
            const xAl = somenteAlnumCodigoBusca(xn);
            if (tAl.length >= 5 && xAl === tAl) return true;
            if (tAl.length >= 5 && gmAlnumEquivalente(tAl, xAl)) return true;
            return variantesLiteraisCodigoGm(t).some((v) => v === xn || somenteAlnumCodigoBusca(v) === xAl);
        });
    }

    /** Match exato GM/EAN/código interno — sem substring numérica frouxa (evita produto errado). */
    function termoIgualCodigoProdutoExato(termoNorm, p) {
        const t = String(termoNorm || '').trim();
        if (!t || !p) return false;
        const tAl = somenteAlnumCodigoBusca(t);

        function cmp(val) {
            if (val == null || val === '') return false;
            const vn = normalizarBuscaLocal(String(val));
            if (vn === t) return true;
            if (/^\d+$/.test(t)) {
                const vd = digitosCodigoBusca(val);
                if (vd === t) return true;
            }
            if (tAl.length >= 5 && somenteAlnumCodigoBusca(vn) === tAl) return true;
            if (tAl.length >= 5 && gmAlnumEquivalente(tAl, somenteAlnumCodigoBusca(vn))) return true;
            return variantesLiteraisCodigoGm(t).some((v) => v === vn || somenteAlnumCodigoBusca(v) === tAl);
        }

        const campos = [
            p.codigo_nfe,
            p.codigo_barras,
            p.codigo_interno,
            p.codigo,
            p.sku,
            p.referencia,
            p.codigo_fornecedor,
        ];
        if (campos.some(cmp)) return true;
        return termoIgualAlgumIndexCodigo(t, p);
    }

    function casaCodigoNumericoNoProduto(palavraBruta, p) {
        const d = String(palavraBruta || '').replace(/\D/g, '');
        if (d.length < 4) return false;
        if (termoIgualAlgumIndexCodigo(normalizarBuscaLocal(String(palavraBruta || '')), p)) return true;
        return codigosSoDigitosProduto(p).some(c => {
            if (c === d) return true;
            if (d.length >= 6 && (c.endsWith(d) || c.includes(d))) return true;
            if (c.length >= 6 && d.length >= 6 && (d.endsWith(c) || d.includes(c))) return true;
            return false;
        });
    }

    function edicaoUnicaNoMaximo(a, b) {
        if (a === b) return true;
        const la = a.length;
        const lb = b.length;
        if (Math.abs(la - lb) > 1) return false;
        let i = 0;
        let j = 0;
        let usado = false;
        while (i < la && j < lb) {
            if (a[i] === b[j]) {
                i++;
                j++;
                continue;
            }
            if (usado) return false;
            usado = true;
            if (la > lb) i++;
            else if (lb > la) j++;
            else {
                i++;
                j++;
            }
        }
        return true;
    }

    function casaPalavraEmTexto(palavraNorm, tokens, hay, fuzzy) {
        if (!palavraNorm) return true;
        if (hay.includes(palavraNorm)) return true;
        return tokens.some(tk => {
            if (tk.includes(palavraNorm)) return true;
            if (palavraNorm.length >= 2 && tk.startsWith(palavraNorm)) return true;
            if (fuzzy && palavraNorm.length >= 4 && tk.length >= 4 && edicaoUnicaNoMaximo(palavraNorm, tk)) return true;
            return false;
        });
    }

    function palavraCasaNoProduto(palavraBruta, tokens, hay, fuzzy, p) {
        const pn = normalizarBuscaLocal(String(palavraBruta || ''));
        if (pn.startsWith('gm') && termoIgualCodigoProdutoExato(pn, p)) return true;
        if (pn.startsWith('gm') && casaCodigoGmPrefixo(pn, p)) return true;
        if (pareceCodigoBarrasNumerico(pn) && termoIgualCodigoBarrasNumericoExato(pn, p)) return true;
        if (casaCodigoNumericoNoProduto(palavraBruta, p)) return true;
        const gmVars = pn.startsWith('gm') ? variantesLiteraisCodigoGm(pn) : [];
        if (gmVars.some((v) => hay.includes(v))) return true;
        return variantesPalavraBusca(palavraBruta).some(v =>
            casaPalavraEmTexto(v, tokens, hay, fuzzy, p)
        );
    }

    /**
     * @param {Array} lista - produtos (mesmo formato da API local: busca_texto, codigo_nfe, etc.)
     * @param {string} termoNormalizado - resultado de normalizarBuscaLocal(termoBruto)
     * @param {'normal'|'scanner'} modo
     */
    function filtrarProdutosBuscaInteligente(lista, termoNormalizado, modo) {
        const termo = String(termoNormalizado || '').trim();
        const palavras = termo.split(/\s+/).filter(Boolean);
        const index = buildBuscaProdutoIndex(lista);
        if (modo === 'scanner') {
            /* Etiqueta GM: só match exato (com/sem hífen); não usar dígitos parciais (15415 ≠ GM1541-5). */
            if (pareceCodigoGmEtiqueta(termo)) {
                return lista.filter((p) => termoIgualCodigoProdutoExato(termo, p));
            }
            /* Código de barras numérico curto (ex. 1813647): match exato só-dígitos. */
            if (pareceCodigoBarrasNumerico(termo)) {
                return lista.filter(
                    (p) =>
                        termoIgualCodigoBarrasNumericoExato(termo, p)
                        || termoIgualCodigoProdutoExato(termo, p)
                );
            }
            const dTerm = termo.replace(/\D/g, '');
            const candidatosIdx = dTerm.length >= 4 ? _indicesPorCodigo(index, dTerm) : null;
            const pool = Array.isArray(candidatosIdx) && candidatosIdx.length
                ? candidatosIdx.map((i) => lista[i]).filter(Boolean)
                : lista;
            return pool.filter(p => {
                if (termoIgualCodigoProdutoExato(termo, p)) return true;
                const hay = textoBuscaProdutoNormalizado(p);
                if (hay.includes(termo)) return true;
                if (termoIgualAlgumIndexCodigo(termo, p)) return true;
                const nfe = normalizarBuscaLocal(String(p.codigo_nfe ?? ''));
                const cb = normalizarBuscaLocal(String(p.codigo_barras ?? ''));
                if (termo === nfe || termo === cb) return true;
                if (dTerm.length >= 4 && casaCodigoNumericoNoProduto(termo, p)) return true;
                return false;
            });
        }
        if (!palavras.length) return [];

        if (palavras.length === 1 && pareceCodigoGmEtiqueta(palavras[0])) {
            const gmHits = lista.filter(
                (p) =>
                    termoIgualCodigoProdutoExato(palavras[0], p)
                    || casaCodigoGmPrefixo(palavras[0], p)
            );
            if (gmHits.length) return gmHits;
        }
        if (palavras.length === 1 && pareceCodigoBarrasNumerico(palavras[0])) {
            const cbHits = lista.filter(
                (p) =>
                    termoIgualCodigoBarrasNumericoExato(palavras[0], p)
                    || termoIgualCodigoProdutoExato(palavras[0], p)
            );
            if (cbHits.length) return cbHits;
        }

        // Pré-filtro por índice local para reduzir varredura linear.
        let pool = lista;
        if (palavras.length) {
            let idxUnion = null;
            palavras.forEach((pl) => {
                const d = String(pl || '').replace(/\D/g, '');
                const local = (d.length >= 4 ? _indicesPorCodigo(index, d) : _indicesPorTokenParcial(index, pl));
                if (!local || !local.length) return;
                const asSet = new Set(local);
                if (idxUnion === null) idxUnion = asSet;
                else idxUnion = new Set([...idxUnion].filter((x) => asSet.has(x)));
            });
            if (idxUnion && idxUnion.size) {
                pool = [...idxUnion].map((i) => lista[i]).filter(Boolean);
            }
        }

        const tentar = (fuzzy) => pool.filter(p => {
            const hay = textoBuscaProdutoNormalizado(p);
            const tokens = tokensBuscaProduto(p);
            return palavras.every(pl => palavraCasaNoProduto(pl, tokens, hay, fuzzy, p));
        });

        let resultados = tentar(false);
        if (resultados.length === 0 && palavras.every(pl => pl.length >= 3)) {
            resultados = tentar(true);
        }
        return resultados;
    }

    /** Mesma ordenação da Consulta / Orçamentos (relevância → média 30d → freq → nome). */
    function montarBuscaTextoRapido(p) {
        const partes = [
            p.nome,
            p.marca,
            p.codigo_nfe,
            p.codigo_barras,
            p.codigo,
            p.prateleira,
            p.referencia,
            p.sku,
            p.codigo_fornecedor,
            p.codigo_interno,
        ].filter(Boolean);
        if (Array.isArray(p.index_codigos)) {
            p.index_codigos.slice(0, 120).forEach((c) => {
                if (c != null && String(c).trim() !== '') partes.push(String(c));
            });
        }
        return normalizarBuscaLocal(partes.join(' '));
    }

    function blobTextoBuscaRelevancia(p) {
        if (p && p.busca_texto) return normalizarBuscaLocal(String(p.busca_texto));
        return montarBuscaTextoRapido(p);
    }

    function relevanciaTextoBuscaPdv(p, termoNorm) {
        if (!termoNorm || typeof termoNorm !== 'string') return 0;
        const t = termoNorm.trim();
        if (!t) return 0;
        if (Array.isArray(p.index_codigos) && p.index_codigos.some((x) => normalizarBuscaLocal(String(x ?? '')) === t)) {
            return 2000000;
        }
        const nome = normalizarBuscaLocal(String(p.nome || ''));
        const blob = blobTextoBuscaRelevancia(p);
        if (nome.includes(t)) return 1000000;
        if (blob.includes(t)) return 500000;
        const palavras = t.split(/\s+/).filter((w) => w.length >= 2);
        let s = 0;
        for (const w of palavras) {
            if (nome.includes(w)) s += 50000;
            else if (blob.includes(w)) s += 5000;
        }
        return s;
    }

    function mediaParaOrdenacaoProduto(p, catalogRef) {
        const id = String(p && p.id != null ? p.id : '');
        if (id && catalogRef) {
            let loc = null;
            if (typeof catalogRef.get === 'function') {
                loc = catalogRef.get(id);
            } else if (Array.isArray(catalogRef)) {
                loc = catalogRef.find((x) => String(x.id) === id);
            }
            if (loc && loc.media_venda_diaria_30d != null && loc.media_venda_diaria_30d !== '') {
                return Number(loc.media_venda_diaria_30d || 0);
            }
        }
        return Number(p && p.media_venda_diaria_30d != null ? p.media_venda_diaria_30d : 0);
    }

    function ordenarSugestoesPdv(lista, termoBuscaNorm, catalogRef) {
        const termoTrim = termoBuscaNorm != null ? String(termoBuscaNorm).trim() : '';
        let freq = {};
        try {
            freq = JSON.parse(localStorage.getItem('freqProdutos') || '{}');
        } catch (_) { /* ignore */ }
        return (Array.isArray(lista) ? lista : []).slice().sort((a, b) => {
            if (termoTrim) {
                const rA = relevanciaTextoBuscaPdv(a, termoTrim);
                const rB = relevanciaTextoBuscaPdv(b, termoTrim);
                if (rA !== rB) return rB - rA;
            }
            const mA = mediaParaOrdenacaoProduto(a, catalogRef);
            const mB = mediaParaOrdenacaoProduto(b, catalogRef);
            if (mA !== mB) return mB - mA;
            const freqA = freq[a.id] || 0;
            const freqB = freq[b.id] || 0;
            if (freqA !== freqB) return freqB - freqA;
            return String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR');
        });
    }

    function mesclarBuscaPdvLocalComApi(termoNorm, locaisOrdenados, apiProdutos, catalogRef, limite) {
        const lim = limite != null ? Math.max(1, Number(limite)) : 60;
        const map = new Map();
        (locaisOrdenados || []).forEach((p) => map.set(String(p.id), p));
        const ordemLocalIds = (locaisOrdenados || []).map((p) => String(p.id));
        const idsLocal = new Set(ordemLocalIds);
        const apiById = new Map();
        (apiProdutos || []).forEach((raw) => {
            const id = String(raw.id);
            apiById.set(id, raw);
            if (!map.has(id)) map.set(id, raw);
        });
        const locaisMesclados = ordemLocalIds.map((id) => {
            const base = map.get(id);
            const apiRow = apiById.get(id);
            return apiRow ? { ...base, ...apiRow } : base;
        }).filter(Boolean);
        const extrasBrutos = (apiProdutos || []).filter((raw) => !idsLocal.has(String(raw.id)));
        const extrasOrd = ordenarSugestoesPdv(extrasBrutos, termoNorm, catalogRef);
        return [...locaisMesclados, ...extrasOrd].slice(0, lim);
    }

    window.normalizarBuscaLocal = normalizarBuscaLocal;
    window.filtrarProdutosBuscaInteligente = filtrarProdutosBuscaInteligente;
    window.casaCodigoNumericoNoProduto = casaCodigoNumericoNoProduto;
    window.pareceCodigoGmEtiqueta = pareceCodigoGmEtiqueta;
    window.pareceCodigoBarrasNumerico = pareceCodigoBarrasNumerico;
    window.termoIgualCodigoBarrasNumericoExato = termoIgualCodigoBarrasNumericoExato;
    window.termoIgualCodigoProdutoExato = termoIgualCodigoProdutoExato;
    window.somenteAlnumCodigoBusca = somenteAlnumCodigoBusca;
    window.variantesLiteraisCodigoGm = variantesLiteraisCodigoGm;
    window.gmAlnumEquivalente = gmAlnumEquivalente;
    window.buildBuscaProdutoIndex = buildBuscaProdutoIndex;
    window.ordenarSugestoesPdv = ordenarSugestoesPdv;
    window.mesclarBuscaPdvLocalComApi = mesclarBuscaPdvLocalComApi;
    window.BUSCA_PDV_LIM_MAX = 60;
})();
</script>
