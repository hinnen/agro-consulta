<style>
  /* Chat lojas — aba colada embaixo da tela (MSN), visual PDV */
  #pdv-chat-loja-dock {
    position: fixed;
    left: max(10.5rem, calc(env(safe-area-inset-left, 0px) + 9.5rem));
    bottom: 0;
    z-index: 220;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    pointer-events: none;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #pdv-chat-loja-dock > * {
    pointer-events: auto;
  }
  #pdv-chat-loja-fab {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    min-height: 2.85rem;
    min-width: 6.75rem;
    padding: 0.5rem 1.25rem 0.55rem;
    border-radius: 0.85rem 0.85rem 0 0;
    border: 2px solid #94a3b8;
    border-bottom: none;
    background: #f8fafc;
    color: #334155;
    font-size: 0.9375rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    box-shadow: 0 -0.15rem 0.45rem rgba(15, 23, 42, 0.08);
    cursor: pointer;
  }
  #pdv-chat-loja-fab:hover {
    background: #e2e8f0;
    color: #0f172a;
  }
  #pdv-chat-loja-fab.is-open {
    border-color: #38bdf8;
    background: #0284c7;
    color: #fff;
    box-shadow: 0 -0.2rem 0.65rem rgba(2, 132, 199, 0.25);
  }
  #pdv-chat-loja-fab.is-alerta {
    border-color: #ea580c;
    background: linear-gradient(180deg, #fff7ed 0%, #ffedd5 100%);
    color: #9a3412;
    animation: cl-pulse-alerta 1s ease-in-out infinite;
    box-shadow:
      0 -0.2rem 0.75rem rgba(234, 88, 12, 0.22),
      0 0 0 2px rgba(251, 146, 60, 0.35);
  }
  #pdv-chat-loja-fab.is-open.is-alerta {
    background: #0284c7;
    color: #fff;
    border-color: #38bdf8;
    animation: none;
    box-shadow: 0 -0.2rem 0.65rem rgba(2, 132, 199, 0.25);
  }
  #pdv-chat-loja-count {
    position: absolute;
    right: 0.2rem;
    top: -0.55rem;
    min-width: 1.35rem;
    min-height: 1.35rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9999px;
    background: #dc2626;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 900;
    line-height: 1;
    padding: 0.12rem 0.35rem;
    border: 2px solid #fff;
    box-shadow: 0 0.12rem 0.35rem rgba(220, 38, 38, 0.45);
  }
  #pdv-chat-loja-fab.is-alerta #pdv-chat-loja-count {
    animation: cl-badge-pop 1s ease-in-out infinite;
  }
  #pdv-chat-loja-count.hidden {
    display: none !important;
  }
  @keyframes cl-pulse-alerta {
    0%, 100% {
      transform: translateY(0);
      box-shadow:
        0 -0.2rem 0.75rem rgba(234, 88, 12, 0.22),
        0 0 0 2px rgba(251, 146, 60, 0.35);
    }
    50% {
      transform: translateY(-0.12rem);
      box-shadow:
        0 -0.35rem 1rem rgba(234, 88, 12, 0.32),
        0 0 0 0.35rem rgba(251, 146, 60, 0.15);
    }
  }
  @keyframes cl-badge-pop {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  html.agro-fx-reduced #pdv-chat-loja-fab.is-alerta {
    animation: none;
  }
  html.agro-fx-reduced #pdv-chat-loja-fab.is-alerta #pdv-chat-loja-count {
    animation: none;
  }

  #pdv-chat-loja-overlay {
    display: none;
    width: min(28rem, calc(100vw - 1.25rem));
    height: min(32rem, calc(100dvh - 5.25rem));
    min-height: 0;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
    border-radius: 0.85rem 0.85rem 0 0;
    border: 2px solid #94a3b8;
    border-bottom: none;
    box-shadow: 0 -0.5rem 1.5rem rgba(15, 23, 42, 0.14);
    transform-origin: bottom left;
  }
  #pdv-chat-loja-overlay.is-open {
    display: flex;
    border-color: #38bdf8;
    animation: cl-pop 0.16s ease-out;
  }
  @keyframes cl-pop {
    from { opacity: 0; transform: translateY(0.45rem); }
    to { opacity: 1; transform: none; }
  }
  html.agro-fx-reduced #pdv-chat-loja-overlay.is-open {
    animation: none;
  }

  #pdv-chat-loja-overlay .cl-panel {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
  }
  #pdv-chat-loja-overlay .cl-msgs {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 0.7rem 0.8rem;
    background: #f8fafc;
  }
  #pdv-chat-loja-overlay .cl-row {
    margin-bottom: 0.55rem;
    max-width: 92%;
  }
  #pdv-chat-loja-overlay .cl-row--eu {
    margin-left: auto;
  }
  #pdv-chat-loja-overlay .cl-bubble {
    border-radius: 0.75rem;
    padding: 0.4rem 0.65rem;
    border: 2px solid #e2e8f0;
    background: #fff;
  }
  #pdv-chat-loja-overlay .cl-row--eu .cl-bubble {
    border-color: #93c5fd;
    background: #eff6ff;
  }
  #pdv-chat-loja-overlay .cl-meta {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #64748b;
    margin-bottom: 0.12rem;
  }
  #pdv-chat-loja-overlay .cl-row--eu .cl-meta { color: #0369a1; }
  #pdv-chat-loja-overlay .cl-text {
    font-size: 1.02rem;
    font-weight: 700;
    color: #0f172a;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.35;
  }
  #pdv-chat-loja-overlay .cl-empty {
    text-align: center;
    color: #64748b;
    font-weight: 700;
    padding: 1.5rem 0.75rem;
  }
  #pdv-chat-loja-overlay .cl-composer {
    display: flex;
    gap: 0.4rem;
    padding: 0.55rem 0.65rem;
    border-top: 2px solid #e2e8f0;
    background: #fff;
  }
  #pdv-chat-loja-overlay .cl-input {
    flex: 1 1 auto;
    min-height: 2.75rem;
    border: 2px solid #cbd5e1;
    border-radius: 0.7rem;
    padding: 0.45rem 0.65rem;
    font-size: 1rem;
    font-weight: 700;
  }
  #pdv-chat-loja-overlay .cl-input:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
  }
  #pdv-chat-loja-overlay .cl-send {
    min-width: 4.75rem;
    min-height: 2.75rem;
    border-radius: 0.7rem;
    background: #0284c7;
    color: #fff;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border: none;
  }
  #pdv-chat-loja-overlay .cl-send:disabled {
    opacity: 0.5;
  }
</style>

<div id="pdv-chat-loja-dock">
  <div id="pdv-chat-loja-overlay" role="dialog" aria-modal="false" aria-labelledby="pdv-chat-loja-title">
    <div class="cl-panel">
      <header class="flex items-center gap-2 border-b-2 border-sky-200 bg-sky-50 px-2.5 py-2">
        <div class="min-w-0 flex-1">
          <h2 id="pdv-chat-loja-title" class="truncate text-sm font-black uppercase tracking-wide text-sky-900">Chat lojas</h2>
          <p class="truncate text-[10px] font-bold text-sky-700/90">Centro + Vila · todos os PCs</p>
        </div>
        <button type="button" id="pdv-chat-loja-fechar" class="pdv-action-btn min-h-[2.35rem] rounded-xl border-2 border-slate-300 bg-white px-2.5 text-xs font-black uppercase text-slate-700">Fechar</button>
      </header>
      <div id="pdv-chat-loja-msgs" class="cl-msgs" aria-live="polite">
        <p class="cl-empty">Carregando…</p>
      </div>
      <p id="pdv-chat-loja-status" class="hidden px-2.5 py-1 text-sm font-bold text-red-700" role="alert"></p>
      <form id="pdv-chat-loja-form" class="cl-composer" autocomplete="off" data-agro-no-double-guard="1">
        <input id="pdv-chat-loja-input" class="cl-input" type="text" maxlength="500" placeholder="Escreva para o grupo…" autocomplete="off">
        <button type="submit" id="pdv-chat-loja-enviar" class="cl-send">Enviar</button>
      </form>
    </div>
  </div>
  <button type="button" id="pdv-chat-loja-fab" title="Chat entre todos os PCs (Centro + Vila)">
    Chat
    <span id="pdv-chat-loja-count" class="hidden">0</span>
  </button>
</div>
