{# Pedir loja — escolha: Pedir (fila) × Transferência forçada (estoque agora) #}
<style>
  #pdv-pedir-loja-escolha .pl-esc-panel {
    width: min(36rem, 96vw);
    border-radius: 1.25rem;
    border: 3px solid #fda4af;
    background: #fff;
    box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
  }
  #pdv-pedir-loja-escolha .pl-esc-btn {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.35rem;
    width: 100%;
    min-height: 5.5rem;
    padding: 1.1rem 1.25rem;
    border-radius: 1rem;
    border: 3px solid transparent;
    text-align: left;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.08s ease;
  }
  #pdv-pedir-loja-escolha .pl-esc-btn:hover {
    filter: brightness(1.03);
  }
  #pdv-pedir-loja-escolha .pl-esc-btn:active {
    transform: scale(0.98);
  }
  #pdv-pedir-loja-escolha .pl-esc-btn-title {
    font-size: clamp(1.35rem, 0.6vw + 1.15rem, 1.75rem);
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  #pdv-pedir-loja-escolha .pl-esc-btn-sub {
    font-size: clamp(0.85rem, 0.3vw + 0.75rem, 1rem);
    font-weight: 700;
    line-height: 1.35;
    opacity: 0.92;
  }
  #pdv-pedir-loja-escolha .pl-esc-btn--pedir {
    border-color: #fb7185;
    background: linear-gradient(180deg, #e11d48 0%, #be123c 100%);
    color: #fff;
    box-shadow: 0 8px 20px -6px rgba(190, 18, 60, 0.45);
  }
  #pdv-pedir-loja-escolha .pl-esc-btn--forcada {
    border-color: #34d399;
    background: linear-gradient(180deg, #059669 0%, #047857 100%);
    color: #fff;
    box-shadow: 0 8px 20px -6px rgba(4, 120, 87, 0.45);
  }
</style>

<div id="pdv-pedir-loja-escolha" class="fixed inset-0 z-[141] hidden items-center justify-center bg-slate-950/55 p-3 backdrop-blur-[2px]" role="dialog" aria-modal="true" aria-labelledby="pdv-pedir-loja-escolha-title">
  <div class="pl-esc-panel flex flex-col overflow-hidden" role="document">
    <header class="shrink-0 flex items-start justify-between gap-3 border-b-2 border-rose-100 bg-gradient-to-r from-rose-50 to-orange-50 px-5 py-4 sm:px-6">
      <div class="min-w-0">
        <h2 id="pdv-pedir-loja-escolha-title" class="text-lg sm:text-xl font-black uppercase text-rose-950 leading-tight">Pedir loja</h2>
        <p class="mt-1 text-sm font-semibold text-slate-600">Escolha o que fazer · Esc fecha</p>
      </div>
      <button type="button" id="pdv-pedir-loja-escolha-fechar" class="inline-flex min-h-[3rem] min-w-[3rem] shrink-0 items-center justify-center rounded-xl border-2 border-slate-300 bg-white text-2xl font-black leading-none text-slate-700 hover:border-red-300 hover:bg-red-50 hover:text-red-700" title="Fechar · Esc" aria-label="Fechar">×</button>
    </header>
    <div class="flex flex-col gap-3 p-5 sm:p-6">
      <button type="button" id="pdv-pedir-loja-escolha-pedir" class="pl-esc-btn pl-esc-btn--pedir">
        <span class="pl-esc-btn-title">Pedir</span>
        <span class="pl-esc-btn-sub">Pede pra outra loja (não tira estoque agora)</span>
      </button>
      <button type="button" id="pdv-pedir-loja-escolha-forcada" class="pl-esc-btn pl-esc-btn--forcada">
        <span class="pl-esc-btn-title">Transferência forçada</span>
        <span class="pl-esc-btn-sub">Tira estoque agora, sem fila</span>
      </button>
      <button type="button" id="pdv-pedir-loja-escolha-cancelar" class="w-full rounded-xl bg-slate-100 py-3.5 text-sm font-black uppercase text-slate-700 hover:bg-slate-200">Cancelar</button>
    </div>
  </div>
</div>
