<div id="pdv-entrega-wizard" class="pdv-ed-wizard-overlay fixed hidden" role="dialog" aria-modal="true" aria-labelledby="pdv-ed-titulo">
  <div id="pdv-ed-shell" class="pdv-ed-wizard-panel rounded-[1.2rem] border-[3px] border-amber-400 bg-white shadow-2xl" data-pdv-ed-painel="pagamento_local" onclick="event.stopPropagation()">
    <div id="pdv-ed-header" class="rounded-t-[1.05rem] border-b border-white/15 bg-gradient-to-r from-amber-600 to-orange-600 px-4 py-2.5 sm:px-5 sm:py-3">
      <p id="pdv-ed-etapa" class="text-[10px] font-black uppercase tracking-[0.18em] text-white/90">Etapa 2 · Entrega</p>
      <h2 id="pdv-ed-titulo" class="mt-0.5 text-[clamp(1rem,0.4vw+0.92rem,1.3rem)] font-black leading-tight text-white">Onde será o pagamento?</h2>
      <p id="pdv-ed-subtitulo" class="mt-0.5 text-xs font-semibold text-white/90">Escolha uma opção para continuar.</p>
    </div>
    <div id="pdv-ed-body" class="rounded-b-[1.05rem] bg-white">
      <div id="pdv-ed-pagamento-local-panel" class="grid gap-2.5 p-3.5 sm:grid-cols-2 sm:gap-3 sm:p-4">
        <button type="button" id="pdv-ef1-entrega" class="pdv-action-btn min-h-[3rem] w-full rounded-2xl border-[3px] border-orange-400 bg-gradient-to-r from-orange-500 to-amber-500 px-3 py-3 text-left text-sm font-black uppercase tracking-wide text-white shadow-md hover:brightness-105 sm:min-h-[3.25rem] sm:text-base">Pagamento na entrega</button>
        <button type="button" id="pdv-ef1-loja" class="pdv-action-btn min-h-[3rem] w-full rounded-2xl border-[3px] border-emerald-300 bg-emerald-50 px-3 py-3 text-left text-sm font-black uppercase tracking-wide text-emerald-950 shadow-sm hover:bg-emerald-100 sm:min-h-[3.25rem] sm:text-base">Pagamento na loja</button>
      </div>
      <div id="pdv-ed-detalhes-panel" class="hidden p-3.5 sm:p-4">
        <div class="grid gap-3 sm:grid-cols-[minmax(0,1.35fr)_minmax(0,0.65fr)] sm:items-start">
          <div>
            <p class="mb-2 text-[11px] font-black uppercase tracking-wide text-slate-600">Taxa de entrega</p>
            <div class="grid gap-2 sm:grid-cols-2">
              <label class="pdv-wiz-choice pdv-wiz-choice--green min-h-[2.5rem] has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50/80">
                <input type="radio" name="pdv-entrega-taxa-modo" value="nao" class="h-4 w-4 shrink-0 text-emerald-600 accent-emerald-600">
                <span class="text-xs font-black uppercase text-slate-800">Não cobrar frete</span>
              </label>
              <label class="pdv-wiz-choice min-h-[2.5rem] border-slate-300 has-[:checked]:border-slate-500 has-[:checked]:bg-slate-100 sm:col-span-2">
                <input type="radio" name="pdv-entrega-taxa-modo" value="depois" class="h-4 w-4 shrink-0 text-slate-600 accent-slate-600">
                <span class="text-xs font-black uppercase text-slate-700">Decidir depois</span>
              </label>
              <div class="flex flex-wrap items-stretch gap-2 sm:col-span-2">
                <label class="pdv-wiz-choice pdv-wiz-choice--orange min-h-[2.5rem] shrink-0 has-[:checked]:border-orange-500 has-[:checked]:bg-orange-50/90">
                  <input type="radio" name="pdv-entrega-taxa-modo" value="sim" class="h-4 w-4 shrink-0 text-orange-600 accent-orange-600">
                  <span class="text-xs font-black uppercase text-slate-800">Cobrar frete</span>
                </label>
                <div id="pdv-entrega-taxa-valor-wrap" class="hidden min-w-0 flex-1 basis-[8rem]">
                  <label class="block h-full rounded-xl border-2 border-dashed border-amber-400 bg-white/90 px-3 py-2">
                    <span class="mb-1 block text-[10px] font-black uppercase text-slate-600">Valor (R$)</span>
                    <input id="pdv-entrega-taxa-valor" type="text" class="pdv-input w-full text-base font-bold" placeholder="10,00" inputmode="decimal" autocomplete="off">
                  </label>
                </div>
              </div>
            </div>
          </div>
          <label class="block">
            <span class="mb-1 block text-[11px] font-black uppercase tracking-wide text-slate-600">Horário</span>
            <input id="pdv-entrega-horario" type="time" class="pdv-input border-sky-200 bg-white" title="Lembretes 20 min antes e no horário">
          </label>
        </div>
      </div>
      <div id="pdv-ed-confirmar-wrap" class="hidden border-t border-slate-100 bg-slate-50 px-3.5 py-2.5 sm:px-4">
        <button type="button" id="pdv-ed-confirmar" class="pdv-action-btn w-full rounded-xl bg-emerald-600 py-2.5 text-sm font-black uppercase text-white shadow-md hover:bg-emerald-700">Confirmar taxa e horário</button>
      </div>
      <div id="pdv-ed-meio-panel" class="hidden grid gap-2.5 p-3.5 sm:grid-cols-2 sm:gap-3 sm:p-4">
        <button type="button" id="pdv-ef2-dinheiro" class="pdv-action-btn min-h-[3rem] w-full rounded-2xl border-[3px] border-slate-300 bg-slate-50 px-3 py-3 text-left text-sm font-black uppercase tracking-wide text-slate-900 shadow-sm hover:bg-slate-100 sm:min-h-[3.25rem] sm:text-base">Dinheiro</button>
        <button type="button" id="pdv-ef2-cartao" class="pdv-action-btn min-h-[3rem] w-full rounded-2xl border-[3px] border-indigo-300 bg-indigo-50 px-3 py-3 text-left text-sm font-black uppercase tracking-wide text-indigo-950 shadow-sm hover:bg-indigo-100 sm:min-h-[3.25rem] sm:text-base">Cartão</button>
      </div>
      <div id="pdv-ed-troco-panel" class="hidden p-3.5 sm:p-4">
        <div class="grid gap-3 sm:grid-cols-[minmax(0,0.95fr)_minmax(0,1.05fr)] sm:items-stretch">
          <div class="flex flex-col justify-center rounded-xl border-2 border-emerald-300 bg-emerald-50 px-3 py-2.5 text-center">
            <p class="text-[10px] font-black uppercase tracking-wide text-emerald-800">Total na entrega</p>
            <p id="pdv-ed-troco-total" class="mt-0.5 text-[clamp(1.2rem,0.5vw+1rem,1.65rem)] font-black tabular-nums text-emerald-950">R$ 0,00</p>
            <p class="mt-0.5 text-[10px] font-semibold leading-snug text-emerald-900/80">Pergunte se precisa de troco.</p>
          </div>
          <div class="flex flex-col justify-center gap-2">
            <label class="block">
              <span class="mb-1 block text-[10px] font-black uppercase text-slate-600">Valor em dinheiro (troco)</span>
              <input type="text" id="pdv-ef3-troco-input" class="pdv-input text-base font-bold" placeholder="Ex.: 100,00 ou 0" inputmode="decimal" autocomplete="off">
            </label>
            <div class="flex gap-2">
              <button type="button" id="pdv-ef3-cancelar" class="flex-1 rounded-xl border-2 border-slate-200 py-2.5 text-xs font-black uppercase text-slate-700 hover:bg-slate-50">Voltar</button>
              <button type="button" id="pdv-ef3-ok" class="flex-1 rounded-xl bg-emerald-600 py-2.5 text-xs font-black uppercase text-white shadow-md hover:bg-emerald-700">Confirmar troco</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
