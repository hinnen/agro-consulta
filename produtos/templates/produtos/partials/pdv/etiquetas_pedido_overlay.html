<div id="pdv-etq-pedido-overlay" class="fixed inset-0 z-[140] hidden items-center justify-center bg-slate-950/60 p-2" role="dialog" aria-modal="true" aria-labelledby="pdv-etq-pedido-titulo">
  <div class="flex h-[min(92dvh,40rem)] w-[min(96vw,72rem)] flex-col overflow-hidden rounded-2xl border-2 border-sky-500 bg-slate-100 shadow-2xl">
    <header class="flex shrink-0 items-center gap-3 border-b-2 border-sky-200 bg-sky-50 px-4 py-3">
      <div class="min-w-0 flex-1">
        <p class="text-[0.7rem] font-black uppercase tracking-[0.16em] text-sky-800">PDV · mesmo pedido do celular</p>
        <h2 id="pdv-etq-pedido-titulo" class="text-xl font-black text-slate-900">Pedir etiquetas</h2>
      </div>
      <button type="button" id="pdv-etq-pedido-fechar" class="inline-flex min-h-12 min-w-12 items-center justify-center rounded-xl border-2 border-slate-300 bg-white text-2xl font-black text-slate-800" title="Fechar · Esc" aria-label="Fechar">×</button>
    </header>
    <div class="grid min-h-0 flex-1 grid-cols-1 gap-3 p-3 lg:grid-cols-[minmax(0,1.4fr)_minmax(18rem,0.8fr)]">
      <section class="flex min-h-0 flex-col gap-2">
        <input id="pdv-etq-pedido-busca" type="search" class="min-h-12 w-full rounded-xl border-2 border-slate-300 bg-white px-3 text-base font-bold" placeholder="Nome, GM ou bipe o código e Enter" autocomplete="off" spellcheck="false" aria-label="Buscar produto para etiqueta">
        <p id="pdv-etq-pedido-sem" class="hidden rounded-xl border-2 border-amber-400 bg-amber-50 px-3 py-2 text-sm font-bold text-amber-950"></p>
        <div id="pdv-etq-pedido-lista" class="min-h-0 flex-1 space-y-2 overflow-y-auto" role="list"></div>
      </section>
      <aside class="flex min-h-0 flex-col rounded-xl border-2 border-slate-200 bg-white p-3">

        <div id="pdv-etq-pedido-sacola" class="mt-2 min-h-0 flex-1 space-y-2 overflow-y-auto"></div>
        <label class="mt-2 flex items-center gap-2 text-sm font-bold text-slate-700">
          <input type="checkbox" id="pdv-etq-pedido-direto">

        </label>
        <p id="pdv-etq-pedido-status" class="mt-2 min-h-[1.25rem] text-sm font-bold text-slate-600" role="status"></p>
        <button type="button" id="pdv-etq-pedido-enviar" class="mt-2 min-h-12 rounded-xl bg-sky-600 text-sm font-black uppercase text-white disabled:opacity-40" disabled>Enviar para a loja</button>
      </aside>
    </div>
  </div>
</div>
