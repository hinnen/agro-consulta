<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ea580c">
  <title>Sem acesso — {{ modulo_label }}</title>
  <link rel="manifest" href="{% url 'vendas_lojas_manifest' %}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f172a; --muted: #64748b;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100dvh; background: #f8fafc; font-family: Inter, system-ui, sans-serif; color: var(--ink); }
    .shell {
      max-width: 28rem; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center;
      padding: max(1rem, var(--safe-t)) 1rem max(1.25rem, var(--safe-b));
    }
    .card {
      background: #fff; border: 2px solid #fdba74; border-radius: 1.25rem; padding: 1.35rem;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.45rem; font-weight: 900; letter-spacing: -0.03em; }
    .who { margin: 0 0 0.85rem; font-size: 0.9rem; font-weight: 800; color: #0f766e; }
    p { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.45; color: var(--muted); }
    .btn {
      display: flex; align-items: center; justify-content: center; min-height: 3.25rem; margin-top: 1.1rem;
      border-radius: 1rem; background: #0f172a; color: #fff; font-weight: 900; text-transform: uppercase;
      text-decoration: none; font-size: 0.95rem;
    }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h1>{{ modulo_label }} — sem acesso</h1>
      {% if operador %}<p class="who">Você entrou como <strong>{{ operador }}</strong>.</p>{% endif %}
      <p>{{ mensagem }}</p>
      <a class="btn" href="{{ hub_url }}">Voltar ao início</a>
    </div>
  </div>
</body>
</html>
