{# Botão flutuante PDV + interruptor «menos animações» (localStorage agro_reduzir_efeitos_v1). #}
<script>
(function () {
  var KEY = "agro_reduzir_efeitos_v1";
  function readReduced() {
    try {
      return localStorage.getItem(KEY) === "1";
    } catch (_) {
      return false;
    }
  }
  window.agroFxReduced = readReduced;
  window.agroSetFxReduced = function (on) {
    var reduced = !!on;
    try {
      localStorage.setItem(KEY, reduced ? "1" : "0");
    } catch (_) {}
    document.documentElement.classList.toggle("agro-fx-reduced", reduced);
    var btn = document.getElementById("agro-pdv-fab-fx-toggle");
    if (btn) {
      btn.setAttribute("aria-pressed", reduced ? "true" : "false");
      btn.title = reduced ? "Ligar animações visuais" : "Desligar animações (PC mais leve)";
      btn.textContent = reduced ? "FX off" : "FX on";
    }
  };
  if (readReduced()) document.documentElement.classList.add("agro-fx-reduced");
})();
</script>
<style id="agro-pdv-fab-styles">
  @keyframes agro-pdv-fab-rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
  }
  @keyframes agro-pdv-fab-pulse {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 10px 28px rgba(0, 191, 255, 0.28), 0 0 0 0 rgba(0, 191, 255, 0.35);
    }
    50% {
      transform: scale(1.06);
      box-shadow: 0 16px 36px rgba(168, 85, 247, 0.35), 0 0 0 10px rgba(255, 105, 180, 0.12);
    }
  }
  @keyframes agro-pdv-fab-blink {
    0%, 100% { opacity: 1; filter: brightness(1); }
    50% { opacity: 0.82; filter: brightness(1.2); }
  }
  @keyframes agro-pdv-fab-icon-rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  #agro-pdv-fab-wrap {
    position: fixed;
    left: max(0.85rem, env(safe-area-inset-left, 0px));
    bottom: max(0.85rem, env(safe-area-inset-bottom, 0px));
    /* Abaixo de modais (z 200+) — evita cobrir Cancelar / dialogs */
    z-index: 90;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.35rem;
    pointer-events: none;
  }
  #agro-pdv-fab-wrap.agro-pdv-fab-wrap--right {
    left: auto;
    right: max(0.85rem, env(safe-area-inset-right, 0px));
    align-items: flex-end;
  }
  #agro-pdv-fab-wrap.is-hidden {
    display: none !important;
  }
  #agro-pdv-fab-wrap > * {
    pointer-events: auto;
  }
  #agro-pdv-fab-fx-toggle {
    min-height: 1.65rem;
    padding: 0.15rem 0.5rem;
    border-radius: 9999px;
    border: 1px solid #cbd5e1;
    background: rgba(255, 255, 255, 0.96);
    color: #475569;
    font-size: 0.625rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1);
  }
  #agro-pdv-fab-fx-toggle:hover {
    border-color: #06b6d4;
    color: #0e7490;
    background: #f0fdfa;
  }
  #agro-pdv-fab-fx-toggle[aria-pressed="true"] {
    border-color: #94a3b8;
    color: #64748b;
    background: #f8fafc;
  }
  #agro-pdv-fab {
    position: relative;
    left: auto;
    bottom: auto;
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    min-height: 3.5rem;
    padding: 0.65rem 1.15rem 0.65rem 0.85rem;
    border-radius: 9999px;
    border: 3px solid transparent;
    background:
      linear-gradient(#ffffff, #f8fafc) padding-box,
      linear-gradient(
        90deg,
        #ef4444,
        #f97316,
        #eab308,
        #22c55e,
        #06b6d4,
        #3b82f6,
        #a855f7,
        #ec4899,
        #ef4444
      ) border-box;
    background-size: 100% 100%, 400% 100%;
    color: #0c4a6e;
    font-size: 0.9375rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-decoration: none;
    isolation: isolate;
    animation:
      agro-pdv-fab-rainbow 4s linear infinite,
      agro-pdv-fab-pulse 2.2s ease-in-out infinite,
      agro-pdv-fab-blink 1.4s ease-in-out infinite;
  }
  #agro-pdv-fab::before {
    content: "";
    position: absolute;
    inset: -6px;
    z-index: -1;
    border-radius: inherit;
    background: linear-gradient(
      90deg,
      #ef4444,
      #f97316,
      #eab308,
      #22c55e,
      #06b6d4,
      #3b82f6,
      #a855f7,
      #ec4899,
      #ef4444
    );
    background-size: 400% 100%;
    filter: blur(10px);
    opacity: 0.55;
    animation: agro-pdv-fab-rainbow 4s linear infinite, agro-pdv-fab-blink 1.4s ease-in-out infinite;
  }
  #agro-pdv-fab:hover {
    animation-play-state: paused, paused, paused;
    transform: scale(1.08);
    color: #082f49;
  }
  #agro-pdv-fab:hover::before {
    animation-play-state: paused, paused;
    opacity: 0.75;
  }
  #agro-pdv-fab:focus-visible {
    outline: 3px solid rgba(168, 85, 247, 0.55);
    outline-offset: 3px;
  }
  #agro-pdv-fab__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    border-radius: 0.65rem;
    background: linear-gradient(135deg, #ef4444, #f97316, #22c55e, #06b6d4, #3b82f6, #a855f7);
    background-size: 300% 300%;
    color: #fff;
    flex-shrink: 0;
    animation: agro-pdv-fab-icon-rainbow 3s linear infinite, agro-pdv-fab-blink 1.4s ease-in-out infinite;
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
  }
  #agro-pdv-fab__icon svg {
    width: 1.2rem;
    height: 1.2rem;
    stroke-width: 2.5;
  }
  #agro-pdv-fab__kbd {
    pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.72rem;
    font-weight: 800;
    padding: 0.2rem 0.42rem;
    border-radius: 0.35rem;
    border: 1px solid #bae6fd;
    background: #f0f9ff;
    color: #0369a1;
    line-height: 1.1;
  }
  /* Interruptor ou SO «reduzir movimento»: efeitos decorativos off */
  html.agro-fx-reduced #agro-pdv-fab,
  html.agro-fx-reduced #agro-pdv-fab::before,
  html.agro-fx-reduced #agro-pdv-fab__icon {
    animation: none !important;
    filter: none !important;
    opacity: 1 !important;
  }
  html.agro-fx-reduced #agro-pdv-fab {
    border: 3px solid #06b6d4;
    background: linear-gradient(#ffffff, #f0f9ff);
    box-shadow: 0 8px 20px rgba(6, 182, 212, 0.22);
    transform: none;
  }
  html.agro-fx-reduced #agro-pdv-fab__icon {
    background: linear-gradient(135deg, #00bfff, #0891b2);
  }
  html.agro-fx-reduced .kpi-validade-alerta,
  html.agro-fx-reduced .kpi-validade-cta,
  html.agro-fx-reduced .btn-main-pulsing-capri,
  html.agro-fx-reduced .btn-main-pulsing-emerald,
  html.agro-fx-reduced .sync-alert-pulse {
    animation: none !important;
  }
  html.agro-fx-reduced .kpi-validade-alerta {
    box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.45), 0 4px 14px rgba(239, 68, 68, 0.12) !important;
  }
  @media (max-width: 480px) {
    #agro-pdv-fab {
      min-height: 3.15rem;
      padding: 0.55rem 0.9rem 0.55rem 0.7rem;
      font-size: 0.8125rem;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    #agro-pdv-fab,
    #agro-pdv-fab::before,
    #agro-pdv-fab__icon {
      animation: none !important;
    }
    #agro-pdv-fab {
      border: 3px solid #06b6d4;
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.25);
    }
  }
</style>
<div id="agro-pdv-fab-wrap" class="is-hidden">
  <button type="button" id="agro-pdv-fab-fx-toggle" aria-pressed="false" title="Desligar animações (PC mais leve)">FX on</button>
  <a id="agro-pdv-fab" href="{% url 'pdv_home' %}" data-prefetch title="Abrir PDV (F1)" aria-label="Abrir PDV">
    <span id="agro-pdv-fab__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    </span>
    <span>PDV</span>
    <kbd id="agro-pdv-fab__kbd">F1</kbd>
  </a>
</div>
<script>
(function () {
  if (window.__agroPdvFabInit) return;
  window.__agroPdvFabInit = true;

  function mountFabInBody() {
    var wrap = document.getElementById("agro-pdv-fab-wrap");
    if (wrap && document.body && wrap.parentNode !== document.body) {
      document.body.appendChild(wrap);
    }
  }
  if (document.body) mountFabInBody();
  else document.addEventListener("DOMContentLoaded", mountFabInBody, { once: true });

  var wrap = document.getElementById("agro-pdv-fab-wrap");
  var fab = document.getElementById("agro-pdv-fab");
  var fxBtn = document.getElementById("agro-pdv-fab-fx-toggle");
  if (!wrap || !fab) return;

  if (typeof window.agroSetFxReduced === "function") {
    window.agroSetFxReduced(window.agroFxReduced());
  }

  if (fxBtn) {
    fxBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (typeof window.agroSetFxReduced === "function") {
        window.agroSetFxReduced(!window.agroFxReduced());
      }
    });
  }

  var PDV_HREF = "{% url 'pdv_home' %}";

  function pathIsPdv() {
    var p = (window.location.pathname || "").replace(/\/+$/, "") || "/";
    if (p === "/pdv" || p.indexOf("/pdv/") === 0) return true;
    if (p === "/consulta" || p.indexOf("/consulta/") === 0) return true;
    return false;
  }

  function inputFocused() {
    var t = document.activeElement;
    return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
  }

  function elVisible(el) {
    if (!el || el === wrap || wrap.contains(el)) return false;
    if (el.classList && el.classList.contains("hidden")) return false;
    if (el.getAttribute && el.getAttribute("aria-hidden") === "true") return false;
    var st = window.getComputedStyle(el);
    if (st.display === "none" || st.visibility === "hidden") return false;
    var op = parseFloat(st.opacity || "1");
    if (Number.isFinite(op) && op < 0.05) return false;
    var r = el.getBoundingClientRect();
    return r.width > 12 && r.height > 12;
  }

  function hasOpenOverlay() {
    var i;
    var dialogs = document.querySelectorAll('[role="dialog"], [aria-modal="true"], .sv-modal');
    for (i = 0; i < dialogs.length; i++) {
      var d = dialogs[i];
      if (d.classList && d.classList.contains("sv-modal") && !d.classList.contains("show")) continue;
      if (elVisible(d)) return true;
    }
    var known = document.querySelectorAll(
      "#agro-nova-saida-overlay:not(.hidden), .agro-ns-overlay:not(.hidden)"
    );
    for (i = 0; i < known.length; i++) {
      if (elVisible(known[i])) return true;
    }
    return false;
  }

  function shouldHide() {
    if (pathIsPdv()) return true;
    if (document.body && document.body.classList.contains("modal-open")) return true;
    if (document.documentElement && document.documentElement.classList.contains("modal-open")) return true;
    if (hasOpenOverlay()) return true;
    return false;
  }

  var refreshTimer = null;
  function scheduleRefresh() {
    if (refreshTimer) return;
    refreshTimer = setTimeout(function () {
      refreshTimer = null;
      refreshVisibility();
    }, 60);
  }

  function refreshVisibility() {
    wrap.classList.toggle("is-hidden", shouldHide());
    if (!wrap.classList.contains("is-hidden")) adjustPosition();
  }

  function baseBottomPx() {
    var v = getComputedStyle(document.documentElement).getPropertyValue("--agro-pdv-fab-base");
    var n = parseFloat(v);
    return Number.isFinite(n) && n > 0 ? n : 14;
  }

  function rectsOverlap(a, b, pad) {
    pad = pad || 10;
    return !(a.right + pad < b.left || a.left - pad > b.right || a.bottom + pad < b.top || a.top - pad > b.bottom);
  }

  function resetFabSide() {
    wrap.style.left = "";
    wrap.style.right = "";
    wrap.classList.remove("agro-pdv-fab-wrap--right");
  }

  function fabRect() {
    return wrap.getBoundingClientRect();
  }

  function collidesWithClickables(pad) {
    var vh = window.innerHeight;
    var vw = window.innerWidth;
    var zoneTop = vh * 0.52;
    var zoneRight = vw * 0.58;
    var rect = fabRect();
    var nodes = document.querySelectorAll(
      "button, a[href], input[type='submit'], input[type='button'], [role='button']"
    );
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (wrap.contains(el)) continue;
      if (!elVisible(el)) continue;
      var r = el.getBoundingClientRect();
      if (r.bottom < zoneTop || r.top > vh - 2) continue;
      if (r.left > zoneRight) continue;
      if (rectsOverlap(rect, r, pad)) return true;
    }
    return false;
  }

  function adjustPosition() {
    if (wrap.classList.contains("is-hidden")) return;
    resetFabSide();
    var base = baseBottomPx();
    wrap.style.bottom = base + "px";
    var rect = fabRect();
    var lift = 0;
    var margin = 10;
    var scanLeft = rect.right + 24;
    var vh = window.innerHeight;
    var nodes = document.querySelectorAll("footer, nav, aside, [class*='fixed'], [class*='sticky']");
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el === wrap || wrap.contains(el) || el.contains(wrap)) continue;
      var st = window.getComputedStyle(el);
      if (st.visibility === "hidden" || st.display === "none" || parseFloat(st.opacity || "1") < 0.05) continue;
      var r = el.getBoundingClientRect();
      if (r.height < 8 || r.width < 8) continue;
      if (r.top < vh * 0.5) continue;
      if (r.left > scanLeft) continue;
      var touchesBottom = st.position === "fixed" || st.position === "sticky" || r.bottom >= vh - 4;
      if (!touchesBottom) continue;
      var overlap = rect.bottom + margin - r.top;
      if (overlap > 0) lift = Math.max(lift, overlap + margin);
    }
    wrap.style.bottom = Math.max(base, base + lift) + "px";

    if (collidesWithClickables(12)) {
      var extraLift = 0;
      var tries = 0;
      while (collidesWithClickables(12) && tries < 8) {
        extraLift += 52;
        wrap.style.bottom = Math.max(base, base + lift + extraLift) + "px";
        tries++;
      }
      if (collidesWithClickables(12)) {
        resetFabSide();
        wrap.style.bottom = Math.max(base, base + lift) + "px";
        wrap.classList.add("agro-pdv-fab-wrap--right");
      }
    }
  }

  document.addEventListener("keydown", function (e) {
    if (e.defaultPrevented) return;
    if (e.code !== "F1" && e.key !== "F1") return;
    if (pathIsPdv()) return;
    if (inputFocused()) return;
    e.preventDefault();
    window.location.href = PDV_HREF;
  });

  fab.addEventListener("click", function (e) {
    if (window.tabManager && typeof window.tabManager.addTab === "function") {
      e.preventDefault();
      window.tabManager.addTab("PDV", PDV_HREF, "shopping-cart");
    }
  });

  refreshVisibility();
  window.addEventListener("resize", adjustPosition);
  window.addEventListener("scroll", adjustPosition, true);
  if (window.MutationObserver && document.body) {
    var mo = new MutationObserver(scheduleRefresh);
    mo.observe(document.body, {
      attributes: true,
      attributeFilter: ["class", "aria-hidden", "style"],
      subtree: true,
    });
    mo.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["class"],
      subtree: false,
    });
  }
  setTimeout(adjustPosition, 120);
  setTimeout(adjustPosition, 800);
})();
</script>
