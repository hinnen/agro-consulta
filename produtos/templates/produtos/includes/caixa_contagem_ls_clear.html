{# Limpa localStorage da contagem de fechamento (só após caixa fechado com sucesso). #}
<script>
(function () {
  var KEYS = [
    'agro_caixa_conferencia_contagem_v1',
    'agro_caixa_conferencia_rascunho_v1',
    'agro_caixa_conferencia_cedulas_v1',
    'agro_caixa_conferencia_turno_v1'
  ];
  window.agroCaixaLimparContagemLocalStorage = function () {
    try {
      KEYS.forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) { /* ignore */ }
  };
  {% if limpar_contagem_caixa_ls %}
  window.agroCaixaLimparContagemLocalStorage();
  {% endif %}
})();
</script>
