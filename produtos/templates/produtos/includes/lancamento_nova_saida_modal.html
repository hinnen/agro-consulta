{% load static %}
{# Modal «Nova saída» — um card por lançamento; tema vermelho (pagar) / verde (receber). #}
<div id="agro-nova-saida-overlay"
     class="agro-ns-overlay hidden fixed inset-0 z-[250] flex flex-col bg-slate-900/60 backdrop-blur-sm"
     role="dialog" aria-modal="true" aria-labelledby="agro-ns-titulo" aria-hidden="true">
  <div id="agro-ns-panel" class="agro-ns-panel agro-ns-panel--pagar bg-white flex flex-col flex-1 min-h-0 w-full max-h-[100dvh] overflow-hidden">

    <div class="agro-ns-header shrink-0 flex flex-wrap items-center justify-between gap-2 border-b-2 border-[var(--ns-accent)] bg-[var(--ns-accent-soft)]">
      <div class="flex flex-wrap items-center gap-3 min-w-0">
        <h2 id="agro-ns-titulo" class="agro-ns-title font-black uppercase tracking-tight text-slate-900">Novo Lançamento</h2>
        <div class="agro-ns-tipo-grp flex items-center gap-1 bg-white/80 p-1 rounded-xl border-2 border-slate-200" role="group" aria-label="Tipo">
          <label class="cursor-pointer">
            <input type="radio" name="agro-ns-tipo" value="pagar" class="sr-only peer" checked>
            <span class="agro-ns-tipo-btn block rounded-lg font-black uppercase peer-checked:bg-red-600 peer-checked:text-white text-slate-600">Pagar</span>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="agro-ns-tipo" value="receber" class="sr-only peer">
            <span class="agro-ns-tipo-btn block rounded-lg font-black uppercase peer-checked:bg-emerald-600 peer-checked:text-white text-slate-600">Receber</span>
          </label>
        </div>
      </div>
      <button type="button" id="agro-ns-fechar" class="agro-ns-btn-icon text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-xl" aria-label="Fechar">
        <svg class="w-full h-full" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <form id="agro-ns-form" class="flex flex-col flex-1 min-h-0 overflow-hidden">
      {% csrf_token %}

      <div class="agro-ns-itens-wrap flex flex-col flex-1 min-h-0">
        <div id="agro-ns-linhas" class="agro-ns-linhas-host flex-1 min-h-0 overflow-y-auto"></div>
      </div>

      <details class="agro-ns-details shrink-0 mx-[var(--ns-pad)] mb-1 rounded-xl border border-slate-200 bg-slate-50 overflow-hidden">
        <summary class="agro-ns-details-sum cursor-pointer flex items-center gap-2 font-bold text-slate-700 hover:bg-slate-100 list-none">
          <span class="text-slate-400 inline-block" aria-hidden="true">▸</span>
          Preencher pela frase (opcional)
        </summary>
        <div class="agro-ns-details-body border-t border-slate-200 space-y-2">
          <div class="flex flex-col sm:flex-row gap-2 sm:items-end">
            <label class="flex-1 min-w-0">
              <span class="agro-ns-label block mb-1">Frase</span>
              <input type="text" id="agro-ns-nlp-texto" autocomplete="off" placeholder="Ex.: energia 479,03 venc 22/04/2026" class="agro-ns-input">
            </label>
            <button type="button" id="agro-ns-btn-nlp" class="agro-ns-btn-secondary shrink-0">Preencher 1º lançamento</button>
          </div>
          <div id="agro-ns-nlp-escl" class="hidden rounded-xl border-2 border-indigo-200 bg-indigo-50 px-3 py-3 space-y-2">
            <p id="agro-ns-nlp-motivo" class="agro-ns-body font-bold text-indigo-950"></p>
            <div id="agro-ns-nlp-campos" class="space-y-2"></div>
            <button type="button" id="agro-ns-nlp-aplicar" class="agro-ns-btn-secondary bg-indigo-600 text-white border-indigo-600">Responder e preencher</button>
          </div>
        </div>
      </details>

      <div class="agro-ns-footer shrink-0 border-t-2 border-slate-200 bg-white flex flex-wrap items-center justify-between gap-2">
        <button type="button" id="agro-ns-cancelar" class="agro-ns-btn-ghost agro-ns-footer-btn font-bold text-slate-600 hover:bg-slate-100 rounded-xl">Cancelar</button>
        <div class="flex flex-wrap items-center justify-end gap-2 min-w-0">
          <button type="button" id="agro-ns-add-linha" class="agro-ns-btn-add-compact flex items-center gap-1.5">
            <svg class="shrink-0 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
            Outro lançamento
          </button>
          <button type="submit" id="agro-ns-submit" class="agro-ns-btn-primary agro-ns-footer-btn text-white font-black rounded-xl shadow-md">Finalizar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<style>
  .agro-ns-panel {
    --ns-pad: clamp(0.5rem, 1.2vw, 1rem);
    --ns-fs-label: clamp(0.9375rem, 0.35vw + 0.82rem, 1.125rem);
    --ns-fs-body: clamp(1rem, 0.45vw + 0.88rem, 1.1875rem);
    --ns-fs-title: clamp(1.25rem, 1vw + 1rem, 1.625rem);
    --ns-fs-sub: clamp(1.0625rem, 0.5vw + 0.9rem, 1.25rem);
    --ns-footer-h: clamp(2.5rem, 3.5vh + 1.5rem, 3rem);
    --ns-input-h: clamp(3.15rem, 3vh + 2.15rem, 3.85rem);
    --ns-gap: clamp(0.5rem, 0.7vw, 0.75rem);
    --ns-accent: #dc2626;
    --ns-accent-hover: #b91c1c;
    --ns-accent-soft: #fef2f2;
    --ns-accent-ring: rgba(220, 38, 38, 0.2);
    --ns-head-bg: #7f1d1d;
    font-size: var(--ns-fs-body);
  }
  .agro-ns-panel--receber {
    --ns-accent: #059669;
    --ns-accent-hover: #047857;
    --ns-accent-soft: #ecfdf5;
    --ns-accent-ring: rgba(5, 150, 105, 0.2);
    --ns-head-bg: #065f46;
  }
  .agro-ns-header, .agro-ns-footer { padding: 0.4rem calc(var(--ns-pad) * 1.25); }
  .agro-ns-linhas-host { padding: var(--ns-pad) calc(var(--ns-pad) * 1.25); padding-top: calc(var(--ns-pad) * 1.1); }
  .agro-ns-title { font-size: var(--ns-fs-title); line-height: 1.15; }
  .agro-ns-subtitle { font-size: var(--ns-fs-sub); line-height: 1.25; }
  .agro-ns-label { font-size: var(--ns-fs-label); font-weight: 800; color: #334155; line-height: 1.2; }
  .agro-ns-hint { font-size: clamp(0.875rem, 0.3vw + 0.78rem, 1rem); font-weight: 600; }
  .agro-ns-body { font-size: var(--ns-fs-body); }
  .agro-ns-footer-btn, .agro-ns-btn-add-compact {
    min-height: var(--ns-footer-h);
    padding: 0.35rem 0.9rem;
    font-size: clamp(0.8125rem, 0.35vw + 0.72rem, 0.9375rem);
    border-radius: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .agro-ns-btn-add-compact {
    background: #fff;
    color: var(--ns-accent);
    border: 2px solid var(--ns-accent);
  }
  .agro-ns-btn-add-compact:hover { background: var(--ns-accent-soft); }
  .agro-ns-tipo-btn {
    padding: 0.45rem 0.85rem;
    font-size: clamp(0.8125rem, 0.35vw + 0.72rem, 1rem);
    min-height: calc(var(--ns-input-h) * 0.85);
    display: flex; align-items: center;
  }
  .agro-ns-input {
    width: 100%; min-height: var(--ns-input-h);
    padding: 0.55rem 0.85rem;
    font-size: var(--ns-fs-body); font-weight: 600; color: #0f172a;
    border: 2px solid #cbd5e1; border-radius: 0.75rem; background: #fff;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .agro-ns-input:focus {
    outline: none; border-color: var(--ns-accent);
    box-shadow: 0 0 0 4px var(--ns-accent-ring);
  }
  .agro-ns-input-icon { padding-left: 2.5rem; }
  .agro-ns-ico {
    position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
    width: 1.25rem; height: 1.25rem; color: #94a3b8; pointer-events: none;
  }
  .agro-ns-btn-icon { width: 3rem; height: 3rem; padding: 0.35rem; }
  .agro-ns-chk { width: 1.35rem; height: 1.35rem; accent-color: var(--ns-accent); }
  .agro-ns-quitado-chip-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: var(--ns-input-h); padding: 0.35rem 0.75rem;
    font-size: clamp(0.8125rem, 0.3vw + 0.75rem, 0.9375rem);
    font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em;
    border: 2px solid #cbd5e1; border-radius: 0.75rem; background: #fff; color: #64748b;
    white-space: nowrap; transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .agro-ns-in-quitado:checked + .agro-ns-quitado-chip-btn {
    background: var(--ns-accent); border-color: var(--ns-accent); color: #fff;
  }
  .agro-ns-wrap-ven.is-quitado .agro-ns-in-ven { opacity: 0.55; }
  .agro-ns-details-sum { padding: 0.55rem 0.85rem; font-size: var(--ns-fs-label); }
  .agro-ns-details-body { padding: 0.65rem 0.85rem 0.85rem; }
  .agro-ns-btn-secondary, .agro-ns-btn-ghost, .agro-ns-btn-primary {
    min-height: var(--ns-input-h); padding: 0.5rem 1.15rem;
    font-size: clamp(0.9375rem, 0.4vw + 0.82rem, 1.125rem);
    border-radius: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .agro-ns-btn-primary { background: var(--ns-accent); padding-left: 1.15rem; padding-right: 1.15rem; }
  .agro-ns-btn-primary:hover { background: var(--ns-accent-hover); }
  .agro-ns-btn-secondary { border: 2px solid #cbd5e1; background: #fff; color: #334155; }
  .agro-ns-card {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 1rem;
    margin-bottom: calc(var(--ns-gap) * 0.85);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    overflow: hidden;
  }
  .agro-ns-card--expandido { padding: calc(var(--ns-pad) * 1.35); }
  .agro-ns-card--retraido { padding: 0; }
  .agro-ns-card:last-child { margin-bottom: 0; }
  .agro-ns-panel--pagar .agro-ns-card { border-left: 4px solid var(--ns-accent); }
  .agro-ns-panel--receber .agro-ns-card { border-left: 4px solid var(--ns-accent); }
  .agro-ns-card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--ns-gap); padding-bottom: 0.35rem;
    border-bottom: 1px solid #f1f5f9;
  }
  .agro-ns-card-num { font-size: var(--ns-fs-label); font-weight: 800; color: #64748b; text-transform: uppercase; white-space: nowrap; }
  .agro-ns-card--retraido .agro-ns-card-inner { display: none; }
  .agro-ns-card--expandido .agro-ns-card-resumo { display: none; }
  .agro-ns-card-resumo {
    display: flex; align-items: center; gap: 0.65rem; width: 100%;
    min-height: clamp(2.35rem, 3.5vh + 1.35rem, 2.85rem);
    padding: 0.4rem 0.75rem; border: none; background: #f8fafc; cursor: pointer; text-align: left;
  }
  .agro-ns-card-resumo:hover { background: var(--ns-accent-soft); }
  .agro-ns-card-resumo-txt {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: clamp(0.8125rem, 0.28vw + 0.72rem, 0.9375rem); font-weight: 600; color: #475569;
  }
  .agro-ns-card-resumo-edit {
    flex-shrink: 0; font-size: clamp(0.75rem, 0.25vw + 0.68rem, 0.8125rem);
    font-weight: 800; text-transform: uppercase; color: var(--ns-accent);
  }
  .agro-ns-card-row {
    display: grid; grid-template-columns: 1fr; gap: var(--ns-gap);
    margin-bottom: var(--ns-gap);
  }
  @media (min-width: 640px) {
    .agro-ns-card-row--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (min-width: 1024px) {
    .agro-ns-card-row--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .agro-ns-card-row--plano { grid-template-columns: 1.4fr 0.75fr 0.95fr 0.95fr; }
  }
  .agro-ns-card-row-desc { margin-bottom: var(--ns-gap); }
  .agro-ns-card-rec {
    border: 1px solid #e2e8f0; border-radius: 0.75rem; background: #f8fafc; overflow: hidden;
  }
  .agro-ns-card-rec > summary {
    padding: 0.5rem 0.75rem; cursor: pointer; font-weight: 700;
    font-size: var(--ns-fs-label); color: #475569; list-style: none;
  }
  .agro-ns-card-rec-body { padding: 0.65rem 0.75rem 0.85rem; border-top: 1px solid #e2e8f0; }
  .agro-ns-rm-linha {
    min-height: 2.25rem; padding: 0.25rem 0.75rem;
    border-radius: 0.5rem; font-size: var(--ns-fs-label); font-weight: 800;
    color: #64748b; border: 2px solid #e2e8f0; background: #fff;
  }
  .agro-ns-rm-linha:hover { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
  .agro-ns-in-valor { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .agro-ns-sug-dd { max-height: min(40vh, 16rem); z-index: 80; }
  .agro-ns-sug-dd li {
    padding: 0.65rem 1rem; font-size: var(--ns-fs-label); font-weight: 700;
    cursor: pointer; border-bottom: 1px solid #f1f5f9;
  }
  .agro-ns-panel--pagar .agro-ns-sug-dd li:hover { background: #fef2f2; color: #991b1b; }
  .agro-ns-panel--receber .agro-ns-sug-dd li:hover { background: #ecfdf5; color: #065f46; }
  .agro-ns-linhas-host::-webkit-scrollbar { width: 8px; }
  .agro-ns-linhas-host::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 8px; }
</style>

<script>
  window.AGRO_NOVA_SAIDA_CFG = {
    apiSug: "{% url 'api_lancamentos_sugestoes' %}",
    apiTexto: "{% url 'api_lancamentos_interpretar_texto' %}",
    apiCriar: "{% url 'api_lancamentos_criar_manual_lote' %}",
    urlListaPagar: "{% url 'lancamentos_contas_pagar' %}",
    urlListaReceber: "{% url 'lancamentos_contas_receber' %}"
  };
</script>
<script src="{% static 'produtos/js/lancamento_nova_saida.js' %}" defer></script>
