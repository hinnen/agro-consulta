{# PIN na 1ª entrada no módulo Lançamentos (sessão); depois só no modo descanso (idle). #}
{% include "produtos/_screensaver_pin.html" with lancamentos_pin_entrada=True %}
<script>
(function () {
  var LS_DESBLOQ = 'gm_lancamentos_desbloqueado';

  function tituloLancamentosPin() {
    var title = document.getElementById('sspin-title');
    var sub = document.getElementById('sspin-sub');
    if (title) title.textContent = 'Lançamentos';
    if (sub) sub.textContent = 'Digite seu PIN para acessar Lançamentos';
  }

  function lancamentosJaDesbloqueado() {
    try {
      return sessionStorage.getItem(LS_DESBLOQ) === '1';
    } catch (_) {
      return false;
    }
  }

  function pedirPinEntradaModulo() {
    tituloLancamentosPin();
    if (typeof window.gmSspinAbrirEntrada === 'function') {
      window.gmSspinAbrirEntrada();
      return;
    }
    setTimeout(pedirPinEntradaModulo, 40);
  }

  function initLancamentosPinEntrada() {
    if (lancamentosJaDesbloqueado()) return;
    pedirPinEntradaModulo();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initLancamentosPinEntrada);
  } else {
    initLancamentosPinEntrada();
  }
})();
</script>
