{# PIN na 1ª entrada no módulo Lançamentos (sessão); depois só no modo descanso (idle). #}
{% include "produtos/_screensaver_pin.html" with lancamentos_pin_entrada=True %}
<script>
(function () {
  var LS_DESBLOQ = 'gm_lancamentos_desbloqueado';

  function pathLancamentos() {
    var p = window.location.pathname || '';
    return p === '/lancamentos' || p.indexOf('/lancamentos/') === 0;
  }

  function isHubLancamentos() {
    var p = window.location.pathname || '';
    return p === '/lancamentos' || p === '/lancamentos/';
  }

  function lancamentosJaDesbloqueado() {
    try {
      return sessionStorage.getItem(LS_DESBLOQ) === '1';
    } catch (_) {
      return false;
    }
  }

  function pedirPinEntradaModulo() {
    if (typeof window.gmSspinAbrirEntrada === 'function') {
      window.gmSspinAbrirEntrada();
      return;
    }
    setTimeout(pedirPinEntradaModulo, 40);
  }

  function redirecionarRetornoAposPin() {
    try {
      var ret = new URLSearchParams(window.location.search || '').get('retorno');
      if (!ret || !isHubLancamentos()) return;
      var dest = ret.charAt(0) === '/' ? ret : '/' + ret;
      if (dest.indexOf('/lancamentos') !== 0) return;
      window.location.replace(dest);
    } catch (_) {}
  }

  function initLancamentosPinEntrada() {
    if (!pathLancamentos()) return;
    if (lancamentosJaDesbloqueado()) {
      redirecionarRetornoAposPin();
      return;
    }
    if (!isHubLancamentos()) {
      var alvo = window.location.pathname + (window.location.search || '');
      window.location.replace('/lancamentos/?retorno=' + encodeURIComponent(alvo));
      return;
    }
    pedirPinEntradaModulo();
  }

  window.addEventListener('gm-lancamentos-desbloqueado', redirecionarRetornoAposPin);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initLancamentosPinEntrada);
  } else {
    initLancamentosPinEntrada();
  }
})();
</script>
