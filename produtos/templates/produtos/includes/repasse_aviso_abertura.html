{% if repasse_aviso_abertura and repasse_aviso_abertura.texto %}
<div id="repasse-aviso-modal" class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 p-3" role="dialog" aria-modal="true">
  <div class="w-full max-w-xl rounded-2xl border-4 border-orange-500 bg-white p-5 shadow-2xl">
    <h2 class="text-xl font-black uppercase text-orange-900">Repasse da Vila</h2>
    <p class="mt-3 text-base font-bold leading-relaxed text-slate-800">{{ repasse_aviso_abertura.texto }}</p>
    <button type="button" id="repasse-aviso-ok" class="mt-5 min-h-[3.25rem] w-full rounded-xl bg-orange-500 text-base font-black uppercase text-white hover:bg-orange-600">Entendi</button>
  </div>
</div>
<script>
(function () {
  var m = document.getElementById('repasse-aviso-modal');
  var b = document.getElementById('repasse-aviso-ok');
  if (b) b.addEventListener('click', function () { if (m) m.remove(); });
})();
</script>
{% endif %}
