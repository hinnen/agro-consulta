<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ea580c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vendas">
  <title>GM Lojas | SisVale</title>
  <link rel="manifest" href="{% url 'vendas_lojas_manifest' %}">
  <link rel="apple-touch-icon" href="/static/produtos/pwa/vendas-lojas-192.png">
  {% include "produtos/_head_perf_mpa.html" %}
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100dvh;
      background: #94a3b8;
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .vl-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(0.85rem, var(--safe-t)) max(1rem, var(--safe-r)) max(1rem, var(--safe-b)) max(1rem, var(--safe-l));
      max-width: 28rem;
      margin: 0 auto;
      background: #f8fafc;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.12), 0 16px 48px rgba(15, 23, 42, 0.18);
    }
    @media (max-width: 28rem), (display-mode: standalone) {
      html, body { background: #f8fafc; }
      .vl-shell { max-width: 100%; box-shadow: none; }
    }
    .vl-kicker {
      margin: 0;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ea580c;
    }
    .vl-title {
      margin: 0.2rem 0 0.35rem;
      font-size: clamp(1.55rem, 6vw + 0.4rem, 2rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }
    .vl-sub {
      margin: 0 0 1.5rem;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
      line-height: 1.35;
    }
    .vl-hub {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      flex: 1;
      justify-content: center;
    }
    .vl-hub a {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-height: 7.5rem;
      padding: 1.25rem 1.35rem;
      border-radius: 1.35rem;
      text-decoration: none;
      color: #fff;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18);
      transition: transform 0.12s ease;
    }
    .vl-hub a:active { transform: scale(0.985); }
    .vl-hub-vendas {
      background: linear-gradient(145deg, #ea580c 0%, #c2410c 100%);
    }
    .vl-hub-tarefas {
      background: linear-gradient(145deg, #0f766e 0%, #115e59 100%);
    }
    .vl-hub a strong {
      font-size: clamp(1.55rem, 6vw + 0.35rem, 1.95rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    .vl-hub a span {
      margin-top: 0.35rem;
      font-size: 0.88rem;
      font-weight: 700;
      opacity: 0.92;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="vl-shell">
    <p class="vl-kicker">GM Agro</p>
    <h1 class="vl-title">O que você quer?</h1>
    <p class="vl-sub">Mesmo app do celular — escolha Vendas ou Tarefas.</p>
    <div class="vl-hub">
      <a class="vl-hub-vendas" href="{% url 'vendas_lojas_resumo' %}">
        <strong>Vendas</strong>
        <span>Faturamento Centro e Vila Elias</span>
      </a>
      <a class="vl-hub-tarefas" href="{% url 'tarefas_lista' %}">
        <strong>Tarefas</strong>
        <span>Pendências, status, comentários e linha do tempo</span>
      </a>
    </div>
  </div>
  <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("{% url 'vendas_lojas_sw' %}", { scope: "/vendas/lojas/" }).catch(function () {});
  }
  </script>
</body>
</html>
