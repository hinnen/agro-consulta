<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Entrar no Zap loja</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#075E54">
</head>
<body style="margin:0;background:#022c22;color:#ecfdf5;font-family:system-ui,sans-serif;">
  <main style="max-width:22rem;margin:0 auto;padding:1.4rem 1.2rem 45vh;">
    <h1 style="margin:0 0 .4rem;font-size:1.7rem;">Entrar no Zap</h1>
    <p style="margin:0 0 1rem;color:#a7f3d0;font-weight:700;">Usuário e senha da loja. O PIN vem depois.</p>
    <form method="post" action="/atendimento-whatsapp/celular/login/">
      {% csrf_token %}
      <input name="username" value="{{ username }}" autocomplete="username" placeholder="Usuário" style="display:block;width:100%;box-sizing:border-box;min-height:3.3rem;margin:0 0 .7rem;border:0;border-radius:.8rem;padding:0 .9rem;font-size:1.15rem;font-weight:800;color:#022c22;background:#fff;">
      <input name="password" type="password" autocomplete="current-password" placeholder="Senha" style="display:block;width:100%;box-sizing:border-box;min-height:3.3rem;margin:0 0 .7rem;border:0;border-radius:.8rem;padding:0 .9rem;font-size:1.15rem;font-weight:800;color:#022c22;background:#fff;">
      <button type="submit" style="width:100%;min-height:3.5rem;border:0;border-radius:.9rem;background:#16a34a;color:#fff;font-size:1.2rem;font-weight:800;">Entrar</button>
    </form>
    {% if erro %}<p style="margin:.8rem 0 0;color:#fecaca;font-weight:800;">{{ erro }}</p>{% endif %}
  </main>
  <script>
  if (navigator.serviceWorker && navigator.serviceWorker.controller && sessionStorage.getItem("wa_login_limpo") !== "1") {
    sessionStorage.setItem("wa_login_limpo", "1");
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) { return r.unregister(); }));
    }).then(function () { window.location.reload(); });
  }
  </script>
</body>
</html>
