{# Escala global (zoom) — calibração uma vez por aparelho; incluído via _agro_consulta_ui.html #}
<script>
  (function () {
    try {
      var sw = screen.width || 0;
      var sh = screen.height || 0;
      var dpr = Math.round((window.devicePixelRatio || 1) * 100);
      var suf = '_' + sw + 'x' + sh + '_' + dpr;
      var ok = localStorage.getItem('agro_display_scale_configured_v1' + suf) === '1';
      if (!ok) ok = localStorage.getItem('agro_display_scale_configured_v1') === '1';
      if (!ok) return;
      var s = localStorage.getItem('agro_display_scale_v1' + suf);
      if (s == null) s = localStorage.getItem('agro_display_scale_v1');
      var n = parseFloat(s, 10);
      if (!isFinite(n) || n < 0.75 || n > 1.5) return;
      if (n === 1) return;
      var zs = String(Math.round(n * 1000) / 1000);
      document.documentElement.style.zoom = zs;
      document.documentElement.setAttribute('data-agro-scale', zs);
      document.documentElement.style.setProperty('--agro-display-scale', zs);
    } catch (e) {}
  })();
</script>
