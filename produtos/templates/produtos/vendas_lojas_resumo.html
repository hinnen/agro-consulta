<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Vendas por loja | SisVale</title>
  {% include "produtos/_head_perf_mpa.html" %}
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --sky: #0369a1;
      --orange: #c2410c;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100dvh;
      background: #f8fafc;
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      overflow-x: hidden;
    }
    .vl-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(0.75rem, var(--safe-t)) max(1rem, var(--safe-r)) max(1rem, var(--safe-b)) max(1rem, var(--safe-l));
      max-width: 32rem;
      margin: 0 auto;
    }
    .vl-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }
    .vl-kicker {
      margin: 0;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ea580c;
    }
    .vl-title {
      margin: 0.15rem 0 0;
      font-size: clamp(1.25rem, 5vw + 0.4rem, 1.65rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .vl-periodo {
      margin: 0.25rem 0 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--muted);
    }
    .vl-voltar {
      flex-shrink: 0;
      min-height: 2.75rem;
      min-width: 2.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.85rem;
      border: 2px solid var(--line);
      background: #fff;
      color: #334155;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .vl-filtros {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.4rem;
      margin: 0 0 1rem;
    }
    .vl-filtro {
      min-height: 3rem;
      border: 2px solid var(--line);
      border-radius: 0.9rem;
      background: #fff;
      color: #334155;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      touch-action: manipulation;
    }
    .vl-filtro.ativo {
      border-color: #059669;
      background: #059669;
      color: #fff;
    }
    .vl-cards {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      flex: 1;
    }
    .vl-card {
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 1.15rem;
      padding: 0.95rem 1rem 1.05rem;
    }
    .vl-card h2 {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .vl-card.centro h2 { color: var(--sky); }
    .vl-card.vila h2 { color: #475569; }
    .vl-card.total {
      border-color: #fdba74;
      background: #fff7ed;
    }
    .vl-card.total h2 { color: var(--orange); }
    .vl-valor {
      margin: 0.35rem 0 0;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .vl-card.centro .vl-valor,
    .vl-card.vila .vl-valor {
      font-size: clamp(2.15rem, 9.5vw + 0.35rem, 3.15rem);
      color: var(--ink);
    }
    .vl-card.total .vl-valor {
      font-size: clamp(2.45rem, 11vw + 0.4rem, 3.55rem);
      color: var(--orange);
    }
    .vl-rs {
      display: block;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 0.1rem;
    }
    .vl-card.total .vl-rs { color: #ea580c; }
  </style>
</head>
<body>
  <div class="vl-shell">
    <header class="vl-top">
      <div>
        <p class="vl-kicker">Vendas</p>
        <h1 class="vl-title">As duas lojas</h1>
        <p class="vl-periodo">{{ periodo_label }}</p>
      </div>
      <a class="vl-voltar" href="{% url 'relatorios_hub' %}">Voltar</a>
    </header>

    <form method="get" class="vl-filtros" aria-label="Filtrar período">
      <button type="submit" name="periodo" value="hoje"
        class="vl-filtro {% if periodo_key == 'hoje' %}ativo{% endif %}">Dia</button>
      <button type="submit" name="periodo" value="semana"
        class="vl-filtro {% if periodo_key == 'semana' %}ativo{% endif %}">Semana</button>
      <button type="submit" name="periodo" value="mes"
        class="vl-filtro {% if periodo_key == 'mes' %}ativo{% endif %}">Mês</button>
      <button type="submit" name="periodo" value="ano"
        class="vl-filtro {% if periodo_key == 'ano' %}ativo{% endif %}">Ano</button>
    </form>

    <div class="vl-cards">
      <article class="vl-card centro">
        <h2>Centro</h2>
        <p class="vl-valor"><span class="vl-rs">R$</span>{{ centro_fmt }}</p>
      </article>
      <article class="vl-card vila">
        <h2>Vila Elias</h2>
        <p class="vl-valor"><span class="vl-rs">R$</span>{{ vila_fmt }}</p>
      </article>
      <article class="vl-card total">
        <h2>Total das duas lojas</h2>
        <p class="vl-valor"><span class="vl-rs">R$</span>{{ total_fmt }}</p>
      </article>
    </div>
  </div>
</body>
</html>
