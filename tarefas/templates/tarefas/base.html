<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vendas">
  <title>{% block title %}Tarefas{% endblock %} | GM</title>
  <link rel="manifest" href="{% url 'vendas_lojas_manifest' %}">
  <link rel="apple-touch-icon" href="/static/produtos/pwa/vendas-lojas-192.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --bg: #f1f5f9;
      --card: #ffffff;
      --line: #e2e8f0;
      --accent: #0f766e;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --vermelho: #dc2626;
      --amarelo: #ca8a04;
      --laranja: #ea580c;
      --verde: #059669;
      --azul: #2563eb;
      --slate: #475569;
      --cinza: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .tf-shell {
      min-height: 100dvh;
      width: 100%;
      max-width: 40rem;
      margin: 0 auto;
      padding: max(0.85rem, var(--safe-t)) max(1rem, var(--safe-r)) max(1rem, var(--safe-b)) max(1rem, var(--safe-l));
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .tf-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.65rem;
      margin-bottom: 0.35rem;
    }
    .tf-kicker {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .tf-title {
      margin: 0.15rem 0 0;
      font-size: clamp(1.65rem, 6.5vw + 0.35rem, 2.15rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.05;
    }
    .tf-ops {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: flex-end;
    }
    .tf-btn {
      min-height: 3rem;
      padding: 0.55rem 0.95rem;
      border-radius: 0.95rem;
      border: 1.5px solid var(--line);
      background: var(--card);
      color: #334155;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .tf-btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .tf-btn-emerald {
      background: var(--verde);
      border-color: var(--verde);
      color: #fff;
    }
    .tf-who {
      margin: 0 0 0.85rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--muted);
    }
    .tf-who strong { color: var(--ink); }
    .badge-st {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.28rem 0.55rem;
      border-radius: 999px;
      color: #fff;
    }
    .badge-st.vermelho { background: var(--vermelho); }
    .badge-st.amarelo { background: var(--amarelo); }
    .badge-st.laranja { background: var(--laranja); }
    .badge-st.verde { background: var(--verde); }
    .badge-st.azul { background: var(--azul); }
    .badge-st.slate { background: var(--slate); }
    .badge-st.cinza { background: var(--cinza); color: #0f172a; }

    .tf-grupo {
      background: var(--card);
      border-radius: 1.15rem;
      border: 1.5px solid var(--line);
      margin: 0 0 0.95rem;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    }
    .tf-grupo-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-bottom: 1.5px solid var(--line);
      border-left: 0.45rem solid var(--line);
    }
    .tf-grupo.vermelho .tf-grupo-hd { border-left-color: var(--vermelho); background: #fef2f2; }
    .tf-grupo.amarelo .tf-grupo-hd { border-left-color: var(--amarelo); background: #fefce8; }
    .tf-grupo.laranja .tf-grupo-hd { border-left-color: var(--laranja); background: #fff7ed; }
    .tf-grupo.verde .tf-grupo-hd { border-left-color: var(--verde); background: #ecfdf5; }
    .tf-grupo.azul .tf-grupo-hd { border-left-color: var(--azul); background: #eff6ff; }
    .tf-grupo.slate .tf-grupo-hd { border-left-color: var(--slate); background: #f8fafc; }
    .tf-grupo.cinza .tf-grupo-hd { border-left-color: var(--cinza); background: #f8fafc; }
    .tf-grupo-hd h2 {
      margin: 0;
      font-size: clamp(1rem, 3.8vw + 0.35rem, 1.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .tf-grupo.vermelho .tf-grupo-hd h2 { color: var(--vermelho); }
    .tf-grupo.amarelo .tf-grupo-hd h2 { color: #a16207; }
    .tf-grupo.laranja .tf-grupo-hd h2 { color: #c2410c; }
    .tf-grupo.verde .tf-grupo-hd h2 { color: #047857; }
    .tf-grupo.azul .tf-grupo-hd h2 { color: #1d4ed8; }
    .tf-grupo.slate .tf-grupo-hd h2 { color: var(--slate); }
    .tf-grupo.cinza .tf-grupo-hd h2 { color: #64748b; }
    .tf-qtd {
      min-width: 2rem;
      height: 2rem;
      padding: 0 0.55rem;
      border-radius: 999px;
      background: #fff;
      border: 1.5px solid var(--line);
      font-size: 0.9rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
    }
    .tf-grupo-bd { padding: 0.55rem 0.65rem 0.7rem; }
    .tf-vazio {
      margin: 0.35rem 0.35rem 0.5rem;
      padding: 0.85rem 0.9rem;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
      background: #f8fafc;
      border-radius: 0.85rem;
    }

    .tf-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 0.95rem;
      padding: 1rem 1.05rem;
      margin: 0.4rem 0.15rem;
    }
    .tf-card:active { background: #f8fafc; }
    .tf-card h3 {
      margin: 0.4rem 0 0.3rem;
      font-size: clamp(1.08rem, 3.5vw + 0.45rem, 1.28rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.25;
    }
    .tf-card p {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.4;
    }

    .tf-field {
      width: 100%;
      margin-bottom: 0.8rem;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      border: 1.5px solid var(--line);
      border-radius: 0.95rem;
      padding: 0.9rem 1rem;
      background: #fff;
      min-height: 3.15rem;
    }
    label.tf-lab {
      display: block;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 0.4rem;
    }
    textarea.tf-field { min-height: 7rem; resize: vertical; }
    .tf-timeline {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .tf-timeline li {
      border-left: 3px solid var(--line);
      padding: 0 0 1rem 0.85rem;
      margin-left: 0.35rem;
    }
    .tf-timeline .when {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
    }
    .tf-timeline .who {
      font-size: 0.92rem;
      font-weight: 800;
    }
    .tf-timeline .det {
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
      margin-top: 0.2rem;
      white-space: pre-wrap;
    }
    .tf-err {
      background: #fef2f2;
      color: #b91c1c;
      border: 1.5px solid #fecaca;
      border-radius: 0.95rem;
      padding: 0.85rem 1rem;
      font-weight: 700;
      margin-bottom: 0.85rem;
      font-size: 0.95rem;
    }
    .tf-fab {
      position: sticky;
      bottom: max(0.75rem, var(--safe-b));
      margin-top: auto;
      padding-top: 0.85rem;
      z-index: 5;
    }
    .tf-fab a, .tf-fab button {
      width: 100%;
      min-height: 3.65rem;
      border-radius: 1.1rem;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1.08rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(15, 118, 110, 0.28);
    }
    .tf-sec {
      margin: 1.1rem 0 0.55rem;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tf-sec.vermelho { color: var(--vermelho); }
    .tf-sec.amarelo { color: var(--amarelo); }
    .tf-sec.laranja { color: var(--laranja); }
    .tf-sec.verde { color: var(--verde); }
    .tf-sec.azul { color: var(--azul); }
    .tf-sec.slate { color: var(--slate); }
    .tf-sec.cinza { color: #64748b; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="tf-shell">
    {% block body %}{% endblock %}
  </div>
  <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("{% url 'vendas_lojas_sw' %}", { scope: "/vendas/lojas/" }).catch(function () {});
  }
  window.tfCsrf = "{{ csrf_token }}";
  window.tfPost = async function (url, data) {
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": window.tfCsrf,
        "X-Requested-With": "XMLHttpRequest",
      },
      body: JSON.stringify(data || {}),
    });
    const j = await res.json().catch(() => ({}));
    if (j.precisa_pin) {
      location.href = "{% url 'tarefas_pin' %}?trocar=1";
      return j;
    }
    if (!res.ok || j.ok === false) {
      throw new Error(j.erro || "Falha ao salvar.");
    }
    return j;
  };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
